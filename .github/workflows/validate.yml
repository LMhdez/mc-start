name: Validate project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check scripts/generate-localized-pages.mjs
          node scripts/generate-localized-pages.mjs --check
          node --check script.js
          node --check status-crypto.js
          node --check cloudflare/worker.js

      - name: Install local test dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Test Durable Object budgets and R2 behavior
        run: npm run test:cloudflare

      - name: Validate Wrangler production bundle without deploying
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-check"
          cd "$RUNNER_TEMP/wrangler-check"
          npm init -y --silent
          npm install --no-save --no-package-lock wrangler@4.156.0
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/wrangler-check/node_modules/.bin/wrangler" deploy --config cloudflare/wrangler.toml --dry-run

      - name: Smoke test public production Worker endpoints
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          WORKER_BASE: https://mc-start-control.luismariohernandezsantos.workers.dev
          FRONTEND_ORIGIN: https://lmhdez.github.io
        run: |
          set -euo pipefail
          for path in /api/public/status /api/technical; do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/mc-worker-smoke.json" --write-out '%{http_code}' --max-time 20 \
              --header "Origin: $FRONTEND_ORIGIN" \
              --header "Accept: application/json" \
              "$WORKER_BASE$path")"
            if [ "$status" != "200" ]; then
              echo "GET $path returned HTTP $status"
              exit 1
            fi
            node - "$RUNNER_TEMP/mc-worker-smoke.json" "$path" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (body?.ok !== true) {
            console.error(`GET ${process.argv[3]} returned an unsuccessful response`);
            process.exit(1);
          }
          if (process.argv[3] === "/api/public/status" &&
              (typeof body.result?.maintenance?.enabled !== "boolean" ||
               typeof body.result?.maintenance?.message !== "string")) {
            console.error("GET /api/public/status is missing the maintenance contract");
            process.exit(1);
          }
          console.log(`GET ${process.argv[3]} -> HTTP 200, ok=true`);
          NODE
          done
          rm -f "$RUNNER_TEMP/mc-worker-smoke.json"

      - name: Smoke test production SSE maintenance event
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          WORKER_BASE: https://mc-start-control.luismariohernandezsantos.workers.dev
          FRONTEND_ORIGIN: https://lmhdez.github.io
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/mc-worker-sse.headers"
          body="$RUNNER_TEMP/mc-worker-sse.body"
          trap 'rm -f "$headers" "$body"' EXIT
          set +e
          http_code="$(curl --silent --show-error --no-buffer --max-time 45 --dump-header "$headers" --output "$body" --write-out '%{http_code}' --header "Origin: $FRONTEND_ORIGIN" --header "Accept: text/event-stream" "$WORKER_BASE/api/public/events")"
          curl_status=$?
          set -e
          if [ "$http_code" != "200" ]; then
            echo "GET /api/public/events returned HTTP $http_code"
            exit 1
          fi
          if ! grep -Eqi '^content-type:[[:space:]]*text/event-stream' "$headers"; then
            echo "GET /api/public/events did not return an SSE content type"
            exit 1
          fi
          if ! grep -Eq '^event: (status|unavailable|heartbeat)$' "$body"; then
            echo "GET /api/public/events did not receive an initial status event"
            exit 1
          fi
          node -e '
          const fs = require("node:fs");
          const lines = fs.readFileSync(process.argv[1], "utf8").split(/\r?\n/);
          const eventIndex = lines.findIndex(line => /^event: (status|unavailable|heartbeat)$/.test(line));
          const dataLine = eventIndex >= 0 ? lines.slice(eventIndex + 1).find(line => line.startsWith("data: ")) : null;
          if (!dataLine) {
            console.error("SSE initial event has no data payload");
            process.exit(1);
          }
          const payload = JSON.parse(dataLine.slice(6));
          if (typeof payload.maintenance?.enabled !== "boolean" ||
              typeof payload.maintenance?.message !== "string") {
            console.error("SSE initial event is missing the maintenance contract");
            process.exit(1);
          }
          console.log("SSE initial event includes the maintenance contract");
          ' "$body"
          if [ "$curl_status" -ne 0 ] && [ "$curl_status" -ne 28 ]; then
            echo "SSE smoke test ended unexpectedly (curl exit $curl_status)"
            exit 1
          fi
          echo "GET /api/public/events -> HTTP 200, maintenance-bearing SSE event confirmed"
      - name: Check Python syntax and agent event tests
        run: |
          python3 -m py_compile vm/mc-agent.py tests/test_mc_agent_events.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check workflow YAML and shell syntax
        run: |
          ruby -ryaml -e '
          Dir.glob(".github/workflows/*.yml").each do |path|
            workflow = YAML.load_file(path, aliases: true)
            source = File.read(path)
            if source.match?(/^  workflow_dispatch:/)
              unless source.include?("github.actor == " + 39.chr + "LMhdez" + 39.chr)
                abort "Manual workflow is not owner-restricted: #{path}"
              end
            end
            (workflow["jobs"] || {}).each_value do |job|
              (job["steps"] || []).each_with_index do |step, index|
                next unless step["run"]
                File.write("/tmp/mc-server-step.sh", step["run"])
                unless system("bash", "-n", "/tmp/mc-server-step.sh")
                  abort "Shell syntax error in #{path}, step #{index + 1}"
                end
              end
            end
            puts "Validated #{path}"
          end
          '
