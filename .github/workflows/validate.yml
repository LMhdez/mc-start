name: Validate project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check status-crypto.js
          node --check cloudflare/worker.js

      - name: Install local test dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Test Durable Object budgets and R2 behavior
        run: npm run test:cloudflare

      - name: Validate Wrangler production bundle without deploying
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-check"
          cd "$RUNNER_TEMP/wrangler-check"
          npm init -y --silent
          npm install --no-save --no-package-lock wrangler@4.156.0
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/wrangler-check/node_modules/.bin/wrangler" deploy --config cloudflare/wrangler.toml --dry-run

      - name: Check Python syntax
        run: python3 -m py_compile vm/mc-agent.py

      - name: Check workflow YAML and shell syntax
        run: |
          ruby -ryaml -e '
          Dir.glob(".github/workflows/*.yml").each do |path|
            workflow = YAML.load_file(path, aliases: true)
            (workflow["jobs"] || {}).each_value do |job|
              (job["steps"] || []).each_with_index do |step, index|
                next unless step["run"]
                File.write("/tmp/mc-server-step.sh", step["run"])
                unless system("bash", "-n", "/tmp/mc-server-step.sh")
                  abort "Shell syntax error in #{path}, step #{index + 1}"
                end
              end
            end
            puts "Validated #{path}"
          end
          '
