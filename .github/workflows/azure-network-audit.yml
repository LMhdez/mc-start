name: Azure network and Geyser audit
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-AUDIT]')
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Read effective Azure network rules and guest configuration
        id: diag
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          AUDIT_COMPLETE=true
          echo '=== NIC / NETWORK SECURITY GROUP ===' > report.txt
          NIC_IDS=$(az vm show -g "$RG" -n "$VM" --query 'networkProfile.networkInterfaces[].id' -o tsv 2>/dev/null)
          if [ -z "$NIC_IDS" ]; then
            echo 'VM NIC: not found or unavailable' >> report.txt
            AUDIT_COMPLETE=false
          fi
          for NIC in $NIC_IDS; do
            echo 'NIC: attached' >> report.txt
            NIC_NSG=$(az network nic show --ids "$NIC" --query 'networkSecurityGroup.id' -o tsv 2>/dev/null)
            SUBNET_IDS=$(az network nic show --ids "$NIC" --query 'ipConfigurations[].subnet.id' -o tsv 2>/dev/null)
            if [ -n "$NIC_NSG" ] && [ "$NIC_NSG" != "None" ]; then
              NSG_NAME=$(basename "$NIC_NSG")
              echo '=== AZURE IDENTITY NETWORK PERMISSIONS ===' >> report.txt
              APP_ID=$(az account show --query user.name -o tsv 2>/dev/null)
              if ! az role assignment list --assignee "$APP_ID" --scope "$NIC_NSG" --include-inherited --query 'length(@)' -o tsv >/dev/null 2>/dev/null; then
                echo 'Role assignments: read denied or unavailable' >> report.txt
                AUDIT_COMPLETE=false
              fi
              echo 'NIC NSG: attached' >> report.txt
              if ! az network nsg rule list -g "$RG" --nsg-name "$NSG_NAME" --query "[?direction=='Inbound'].{name:name,access:access,protocol:protocol,priority:priority,sourceAddressPrefix:sourceAddressPrefix,sourceAddressPrefixes:sourceAddressPrefixes,sourcePortRange:sourcePortRange,sourcePortRanges:sourcePortRanges,destinationPortRange:destinationPortRange,destinationPortRanges:destinationPortRanges}" -o json 2>/dev/null | jq 'map({access,protocol,priority,sourcePortRange,sourcePortRanges,destinationPortRange,destinationPortRanges,sourceScope: (([.sourceAddressPrefix] + (.sourceAddressPrefixes // [])) | map(select(. != null and . != "")) | if any(.[]; . == "*" or . == "Internet" or . == "0.0.0.0/0" or . == "::/0") then "ANY/INTERNET" elif any(.[]; . == "VirtualNetwork" or . == "AzureLoadBalancer") then "AZURE SERVICE SCOPE" elif length > 0 then "RESTRICTED (CIDRs redacted)" else "UNSPECIFIED" end)})' >> report.txt 2>nsg-error.txt; then
                echo 'NIC NSG rules: read denied or unavailable' >> report.txt
                AUDIT_COMPLETE=false
              fi
            else echo 'NIC NSG: none' >> report.txt; fi
            for SUBNET in $SUBNET_IDS; do
              : > subnet-read-error.txt
              if SUBNET_NSG=$(az network vnet subnet show --ids "$SUBNET" --query 'networkSecurityGroup.id' -o tsv 2>subnet-read-error.txt); then
                if [ -n "$SUBNET_NSG" ] && [ "$SUBNET_NSG" != "None" ]; then
                  NSG_NAME=$(basename "$SUBNET_NSG")
                  echo 'Subnet NSG: attached' >> report.txt
                  if ! az network nsg rule list -g "$RG" --nsg-name "$NSG_NAME" --query "[?direction=='Inbound'].{name:name,access:access,protocol:protocol,priority:priority,sourceAddressPrefix:sourceAddressPrefix,sourceAddressPrefixes:sourceAddressPrefixes,sourcePortRange:sourcePortRange,sourcePortRanges:sourcePortRanges,destinationPortRange:destinationPortRange,destinationPortRanges:destinationPortRanges}" -o json 2>/dev/null | jq 'map({access,protocol,priority,sourcePortRange,sourcePortRanges,destinationPortRange,destinationPortRanges,sourceScope: (([.sourceAddressPrefix] + (.sourceAddressPrefixes // [])) | map(select(. != null and . != "")) | if any(.[]; . == "*" or . == "Internet" or . == "0.0.0.0/0" or . == "::/0") then "ANY/INTERNET" elif any(.[]; . == "VirtualNetwork" or . == "AzureLoadBalancer") then "AZURE SERVICE SCOPE" elif length > 0 then "RESTRICTED (CIDRs redacted)" else "UNSPECIFIED" end)})' >> report.txt 2>nsg-error.txt; then echo 'Subnet NSG rules: read denied or unavailable' >> report.txt; AUDIT_COMPLETE=false; fi
                else echo 'Subnet NSG: none' >> report.txt; fi
              else
                AZ_READ_ERROR=$(grep -oE 'AuthorizationFailed|Forbidden|ResourceNotFound|SubscriptionNotFound|NoRegisteredProviderFound' subnet-read-error.txt | head -n 1 || true)
                case "$AZ_READ_ERROR" in
                  AuthorizationFailed|Forbidden) echo 'Subnet NSG: authorization denied' >> report.txt ;;
                  ResourceNotFound) echo 'Subnet NSG: resource not found' >> report.txt ;;
                  SubscriptionNotFound) echo 'Subnet NSG: subscription unavailable' >> report.txt ;;
                  NoRegisteredProviderFound) echo 'Subnet NSG: provider unavailable' >> report.txt ;;
                  *) echo 'Subnet NSG: read failed (error category unknown)' >> report.txt ;;
                esac
                AUDIT_COMPLETE=false
              fi
            done
            PUB=$(az network nic show --ids "$NIC" --query 'ipConfigurations[?publicIpAddress!=null].name' -o tsv 2>/dev/null)
            if [ -n "$PUB" ]; then echo 'Public IP association: YES' >> report.txt; else echo 'Public IP association: NO' >> report.txt; fi
          done
          SCRIPT=$(cat <<'EOS'
          echo '=== GEYSER CONFIG FILE DISCOVERY ==='
          if docker exec mc-server sh -c '[ -f /data/config/Geyser-Fabric/config.yml ]'; then
            echo 'Geyser configuration file: found'
            echo '=== GEYSER EFFECTIVE CONFIG KEYS ==='
            docker exec mc-server sh -c 'grep -h -nEi "^[[:space:]]*(bedrock:|port:|clone-remote-port:|broadcast-port:|transport:|webrtc-port:|mode:|use-direct-connection:)" /data/config/Geyser-Fabric/config.yml 2>/dev/null || true' 2>/dev/null | sed -E 's/^[0-9]+:[[:space:]]*([^:]+):.*/\1/' | sort -u | sed 's/^/Geyser key: /'
          else
            echo 'Geyser configuration file: not found'
          fi
          echo '=== PUBLISHED PORTS ==='
          docker port mc-server 2>/dev/null | sed -E 's/.*:([0-9]+)$/container port \1/' || true
          echo '=== SSH EFFECTIVE AUTHENTICATION POLICY ==='
          if command -v sshd >/dev/null 2>&1; then
            if sshd -T 2>/dev/null | grep -Eq '^(passwordauthentication|permitrootlogin|pubkeyauthentication|kbdinteractiveauthentication|authenticationmethods|usepam|maxauthtries) '; then
              echo 'SSH effective authentication policy: collected (values withheld)'
            else
              echo 'SSH effective authentication policy: unavailable'
            fi
          else
            echo 'sshd: unavailable'
          fi
          echo '=== SSH / FAIL2BAN SERVICE STATE ==='
          for SVC in ssh sshd fail2ban; do
            STATE=$(systemctl is-active "$SVC" 2>/dev/null || true)
            if [ -n "$STATE" ]; then echo "$SVC: $STATE"; fi
          done
          if command -v fail2ban-client >/dev/null 2>&1 && systemctl is-active --quiet fail2ban 2>/dev/null; then
            fail2ban-client status 2>/dev/null | sed -n -E 's/^Status[[:space:]]*$/Status: available/p; s/^[[:space:]]*Number of jail:[[:space:]]*/Jails configured: /p'
          fi
          EOS
          )
          if ! az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --scripts "$SCRIPT" --query 'value[0].message' -o tsv > guest.txt 2>/dev/null; then
            echo 'Guest diagnostics: read denied or unavailable' > guest.txt
            AUDIT_COMPLETE=false
          fi
          if [ ! -s guest.txt ] || grep -Fq 'Geyser configuration file: not found' guest.txt; then AUDIT_COMPLETE=false; fi
          echo "Audit completeness: $AUDIT_COMPLETE" >> report.txt
          echo "audit_complete=$AUDIT_COMPLETE" >> "$GITHUB_OUTPUT"
          # Raw Azure and guest output stays on the ephemeral runner and is never exported.
      - uses: actions/github-script@v7
        env:
          AUDIT_COMPLETE: ${{ steps.diag.outputs.audit_complete }}
        with:
          script: |
            const complete = process.env.AUDIT_COMPLETE === 'true';
            const heading = complete ? '## Azure / Geyser read-only audit — complete' : '## Azure / Geyser read-only audit — incomplete';
            const note = complete
              ? 'All required read-only checks completed. Detailed infrastructure output is intentionally withheld.'
              : 'At least one required Azure or guest read was denied or unavailable. Detailed infrastructure output is intentionally withheld; keep this issue open.';
            const body = heading + '\n\n' + note + '\n\nNo raw command output, resource identifiers, network ranges, configuration values, or guest diagnostics are published.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state: complete ? 'closed' : 'open'});
