name: Azure network and Geyser audit
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-AUDIT]')
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Read effective Azure network rules and guest configuration
        id: diag
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -eu
          echo '=== NIC / NETWORK SECURITY GROUP ===' > report.txt
          NIC_IDS=$(az vm show -g "$RG" -n "$VM" --query 'networkProfile.networkInterfaces[].id' -o tsv)
          for NIC in $NIC_IDS; do
            echo "NIC: $(basename "$NIC")" >> report.txt
            NIC_NSG=$(az network nic show --ids "$NIC" --query 'networkSecurityGroup.id' -o tsv)
            SUBNET_IDS=$(az network nic show --ids "$NIC" --query 'ipConfigurations[].subnet.id' -o tsv)
            if [ -n "$NIC_NSG" ] && [ "$NIC_NSG" != "None" ]; then
              NSG_NAME=$(basename "$NIC_NSG")
              echo '=== AZURE IDENTITY NETWORK PERMISSIONS ===' >> report.txt
              APP_ID=$(az account show --query user.name -o tsv)
              if ! az role assignment list --assignee "$APP_ID" --scope "$NIC_NSG" --include-inherited --query '[].roleDefinitionName' -o tsv >> report.txt 2>/dev/null; then
                echo 'Role assignments: read denied or unavailable' >> report.txt
              fi
              echo "NIC NSG: $NSG_NAME" >> report.txt
              if ! az network nsg rule list -g "$RG" --nsg-name "$NSG_NAME" --query "[?direction=='Inbound'].{name:name,access:access,protocol:protocol,priority:priority,sourceAddressPrefix:sourceAddressPrefix,sourceAddressPrefixes:sourceAddressPrefixes,sourcePortRange:sourcePortRange,sourcePortRanges:sourcePortRanges,destinationPortRange:destinationPortRange,destinationPortRanges:destinationPortRanges}" -o json | jq 'map({name,access,protocol,priority,sourcePortRange,sourcePortRanges,destinationPortRange,destinationPortRanges,sourceScope: (([.sourceAddressPrefix] + (.sourceAddressPrefixes // [])) | map(select(. != null and . != "")) | if any(.[]; . == "*" or . == "Internet" or . == "0.0.0.0/0" or . == "::/0") then "ANY/INTERNET" elif any(.[]; . == "VirtualNetwork" or . == "AzureLoadBalancer") then "AZURE SERVICE SCOPE" elif length > 0 then "RESTRICTED (CIDRs redacted)" else "UNSPECIFIED" end)})' >> report.txt 2>nsg-error.txt; then
                echo 'NIC NSG rules: read denied or unavailable' >> report.txt
              fi
            else echo 'NIC NSG: none' >> report.txt; fi
            for SUBNET in $SUBNET_IDS; do
              if SUBNET_NSG=$(az network vnet subnet show --ids "$SUBNET" --query 'networkSecurityGroup.id' -o tsv 2>/dev/null); then
                if [ -n "$SUBNET_NSG" ] && [ "$SUBNET_NSG" != "None" ]; then
                  NSG_NAME=$(basename "$SUBNET_NSG")
                  echo "Subnet NSG: $NSG_NAME" >> report.txt
                  if ! az network nsg rule list -g "$RG" --nsg-name "$NSG_NAME" --query "[?direction=='Inbound'].{name:name,access:access,protocol:protocol,priority:priority,sourceAddressPrefix:sourceAddressPrefix,sourceAddressPrefixes:sourceAddressPrefixes,sourcePortRange:sourcePortRange,sourcePortRanges:sourcePortRanges,destinationPortRange:destinationPortRange,destinationPortRanges:destinationPortRanges}" -o json | jq 'map({name,access,protocol,priority,sourcePortRange,sourcePortRanges,destinationPortRange,destinationPortRanges,sourceScope: (([.sourceAddressPrefix] + (.sourceAddressPrefixes // [])) | map(select(. != null and . != "")) | if any(.[]; . == "*" or . == "Internet" or . == "0.0.0.0/0" or . == "::/0") then "ANY/INTERNET" elif any(.[]; . == "VirtualNetwork" or . == "AzureLoadBalancer") then "AZURE SERVICE SCOPE" elif length > 0 then "RESTRICTED (CIDRs redacted)" else "UNSPECIFIED" end)})' >> report.txt 2>nsg-error.txt; then echo 'Subnet NSG rules: read denied' >> report.txt; fi
                else echo 'Subnet NSG: none' >> report.txt; fi
              else echo 'Subnet NSG: unavailable (Azure RBAC denies subnet read)' >> report.txt; fi
            done
            PUB=$(az network nic show --ids "$NIC" --query 'ipConfigurations[?publicIpAddress!=null].name' -o tsv)
            if [ -n "$PUB" ]; then echo 'Public IP association: YES' >> report.txt; else echo 'Public IP association: NO' >> report.txt; fi
          done
          SCRIPT=$(cat <<'EOS'
          echo '=== GEYSER CONFIG FILE DISCOVERY ==='
          docker exec mc-server sh -c 'find /data /config /plugins /opt -type f 2>/dev/null | grep -Ei "geyser|config\\.(yml|yaml)$" | head -60' || true
          echo '=== GEYSER EFFECTIVE CONFIG KEYS ==='
          docker exec mc-server sh -c 'find /data /config /plugins /opt -type f \( -iname "*.yml" -o -iname "*.yaml" \) 2>/dev/null | while read f; do if echo "$f" | grep -qi geyser || grep -qi geyser "$f" 2>/dev/null; then echo "FILE=$f"; grep -nEi "^[[:space:]]*(bedrock:|port:|clone-remote-port:|broadcast-port:|address:|transport:|webrtc-port:|signaling:|mode:|use-direct-connection:)" "$f" 2>/dev/null || true; fi; done' 2>&1 | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/[IP REDACTED]/g'
          echo '=== PUBLISHED PORTS ==='
          docker port mc-server 2>&1 || true
          EOS
          )
          az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --scripts "$SCRIPT" --query 'value[0].message' -o tsv > guest.txt
          { echo 'report<<EOF'; cat report.txt; cat guest.txt; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.diag.outputs.report }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'## Azure / Geyser read-only audit\n\n```text\n'+(process.env.REPORT||'No report')+'\n```'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});