name: Azure network and Geyser audit
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-AUDIT]')
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Read effective Azure network rules and guest configuration
        id: diag
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          AUDIT_COMPLETE=true
          AUDIT_REASONS=()
          NIC_RULE_SUMMARY='[]'
          SUBNET_RULE_SUMMARY='[]'
          add_audit_reason() {
            case "$1" in
              vm_nic_read_unavailable|role_assignment_read_unavailable|nic_nsg_rules_unavailable|subnet_authorization_denied|subnet_resource_not_found|subnet_subscription_unavailable|subnet_provider_unavailable|subnet_read_error_unknown|subnet_nsg_rules_unavailable|guest_diagnostics_unavailable|guest_output_empty|geyser_config_missing)
                AUDIT_REASONS+=("$1")
                ;;
            esac
          }
          echo '=== NIC / NETWORK SECURITY GROUP ===' > report.txt
          NIC_IDS=$(az vm show -g "$RG" -n "$VM" --query 'networkProfile.networkInterfaces[].id' -o tsv 2>/dev/null)
          if [ -z "$NIC_IDS" ]; then
            echo 'VM NIC: not found or unavailable' >> report.txt
            AUDIT_COMPLETE=false
            add_audit_reason vm_nic_read_unavailable
          fi
          for NIC in $NIC_IDS; do
            echo 'NIC: attached' >> report.txt
            NIC_NSG=$(az network nic show --ids "$NIC" --query 'networkSecurityGroup.id' -o tsv 2>/dev/null)
            SUBNET_IDS=$(az network nic show --ids "$NIC" --query 'ipConfigurations[].subnet.id' -o tsv 2>/dev/null)
            if [ -n "$NIC_NSG" ] && [ "$NIC_NSG" != "None" ]; then
              NSG_NAME=$(basename "$NIC_NSG")
              echo '=== AZURE IDENTITY NETWORK PERMISSIONS ===' >> report.txt
              APP_ID=$(az account show --query user.name -o tsv 2>/dev/null)
              if ! az role assignment list --assignee "$APP_ID" --scope "$NIC_NSG" --include-inherited --query 'length(@)' -o tsv >/dev/null 2>/dev/null; then
                echo 'Role assignments: read denied or unavailable' >> report.txt
                AUDIT_COMPLETE=false
                add_audit_reason role_assignment_read_unavailable
              fi
              echo 'NIC NSG: attached' >> report.txt
              if NIC_RULE_SUMMARY=$(az network nsg rule list -g "$RG" --nsg-name "$NSG_NAME" --query "[?direction=='Inbound'].{access:access,protocol:protocol,sourceAddressPrefix:sourceAddressPrefix,sourceAddressPrefixes:sourceAddressPrefixes,destinationPortRange:destinationPortRange,destinationPortRanges:destinationPortRanges}" -o json 2>/dev/null | jq -c 'map({access,protocol,destinationPortRange,destinationPortRanges,sourceScope: (([.sourceAddressPrefix] + (.sourceAddressPrefixes // [])) | map(select(. != null and . != "")) | if any(.[]; . == "*" or . == "Internet" or . == "0.0.0.0/0" or . == "::/0") then "ANY/INTERNET" elif any(.[]; . == "VirtualNetwork" or . == "AzureLoadBalancer") then "AZURE SERVICE SCOPE" elif length > 0 then "RESTRICTED (CIDRs redacted)" else "UNSPECIFIED" end)})'); then
                echo 'NIC NSG rules: sanitized summary collected' >> report.txt
              else
                echo 'NIC NSG rules: read denied or unavailable' >> report.txt
                AUDIT_COMPLETE=false
                add_audit_reason nic_nsg_rules_unavailable
                NIC_RULE_SUMMARY='[]'
              fi
            else echo 'NIC NSG: none' >> report.txt; fi
            for SUBNET in $SUBNET_IDS; do
              : > subnet-read-error.txt
              if SUBNET_NSG=$(az network vnet subnet show --ids "$SUBNET" --query 'networkSecurityGroup.id' -o tsv 2>subnet-read-error.txt); then
                if [ -n "$SUBNET_NSG" ] && [ "$SUBNET_NSG" != "None" ]; then
                  NSG_NAME=$(basename "$SUBNET_NSG")
                  echo 'Subnet NSG: attached' >> report.txt
                  if SUBNET_RULE_SUMMARY=$(az network nsg rule list -g "$RG" --nsg-name "$NSG_NAME" --query "[?direction=='Inbound'].{access:access,protocol:protocol,sourceAddressPrefix:sourceAddressPrefix,sourceAddressPrefixes:sourceAddressPrefixes,destinationPortRange:destinationPortRange,destinationPortRanges:destinationPortRanges}" -o json 2>/dev/null | jq -c 'map({access,protocol,destinationPortRange,destinationPortRanges,sourceScope: (([.sourceAddressPrefix] + (.sourceAddressPrefixes // [])) | map(select(. != null and . != "")) | if any(.[]; . == "*" or . == "Internet" or . == "0.0.0.0/0" or . == "::/0") then "ANY/INTERNET" elif any(.[]; . == "VirtualNetwork" or . == "AzureLoadBalancer") then "AZURE SERVICE SCOPE" elif length > 0 then "RESTRICTED (CIDRs redacted)" else "UNSPECIFIED" end)})'); then
                    echo 'Subnet NSG rules: sanitized summary collected' >> report.txt
                  else
                    echo 'Subnet NSG rules: read denied or unavailable' >> report.txt
                    AUDIT_COMPLETE=false
                    add_audit_reason subnet_nsg_rules_unavailable
                    SUBNET_RULE_SUMMARY='[]'
                  fi
                else echo 'Subnet NSG: none' >> report.txt; fi
              else
                AZ_READ_ERROR=$(grep -oE 'AuthorizationFailed|Forbidden|ResourceNotFound|SubscriptionNotFound|NoRegisteredProviderFound' subnet-read-error.txt | head -n 1 || true)
                case "$AZ_READ_ERROR" in
                  AuthorizationFailed|Forbidden) echo 'Subnet NSG: authorization denied' >> report.txt; add_audit_reason subnet_authorization_denied ;;
                  ResourceNotFound) echo 'Subnet NSG: resource not found' >> report.txt; add_audit_reason subnet_resource_not_found ;;
                  SubscriptionNotFound) echo 'Subnet NSG: subscription unavailable' >> report.txt; add_audit_reason subnet_subscription_unavailable ;;
                  NoRegisteredProviderFound) echo 'Subnet NSG: provider unavailable' >> report.txt; add_audit_reason subnet_provider_unavailable ;;
                  *) echo 'Subnet NSG: read failed (error category unknown)' >> report.txt; add_audit_reason subnet_read_error_unknown ;;
                esac
                AUDIT_COMPLETE=false
              fi
            done
            PUB=$(az network nic show --ids "$NIC" --query 'ipConfigurations[?publicIpAddress!=null].name' -o tsv 2>/dev/null)
            if [ -n "$PUB" ]; then echo 'Public IP association: YES' >> report.txt; else echo 'Public IP association: NO' >> report.txt; fi
          done
          SCRIPT=$(cat <<'EOS'
          echo '=== GEYSER CONFIG FILE DISCOVERY ==='
          if docker exec mc-server sh -c '[ -f /data/config/Geyser-Fabric/config.yml ]'; then
            echo 'Geyser configuration file: found'
            echo '=== GEYSER EFFECTIVE CONFIG KEYS ==='
            docker exec mc-server sh -c 'grep -h -nEi "^[[:space:]]*(bedrock:|port:|clone-remote-port:|broadcast-port:|transport:|webrtc-port:|mode:|use-direct-connection:)" /data/config/Geyser-Fabric/config.yml 2>/dev/null || true' 2>/dev/null | sed -E 's/^[0-9]+:[[:space:]]*([^:]+):.*/\1/' | sort -u | sed 's/^/Geyser key: /'
            echo '=== GEYSER SAFE TRANSPORT SETTINGS ==='
            docker exec mc-server sh -c "awk -F: '
              /^bedrock:[[:space:]]*$/ { in_bedrock=1; next }
              /^[^[:space:]#][^:]*:/ { in_bedrock=0 }
              in_bedrock && /^[[:space:]]+port:[[:space:]]*/ { value=\$2; gsub(/[[:space:]\"]/ , \"\", value); if (value ~ /^[0-9]+$/ && value >= 1 && value <= 65535) print \"Geyser Bedrock port: \" value }
              in_bedrock && /^[[:space:]]+clone-remote-port:/ { value=tolower(\$2); gsub(/[[:space:]\"]/ , \"\", value); if (value == \"true\" || value == \"false\") print \"Geyser clone remote port: \" value }
              /^[[:space:]]*transport:/ { value=tolower(\$2); gsub(/[[:space:]\"]/ , \"\", value); if (value == \"udp\" || value == \"tcp\" || value == \"webrtc\" || value == \"auto\") print \"Geyser transport: \" toupper(value); else print \"Geyser transport: OTHER\" }
              /^[[:space:]]*webrtc-port:/ { value=\$2; gsub(/[[:space:]\"]/ , \"\", value); if (value ~ /^[0-9]+$/ && value >= 1 && value <= 65535) print \"Geyser WebRTC port: \" value }
              /^[[:space:]]*use-direct-connection:/ { value=tolower(\$2); gsub(/[[:space:]\"]/ , \"\", value); if (value == \"true\" || value == \"false\") print \"Geyser direct connection: \" value }
            ' /data/config/Geyser-Fabric/config.yml" 2>/dev/null || true
            echo '=== LIVE BEDROCK SOCKETS ==='
            docker exec mc-server sh -c '
              awk '"'"'BEGIN { files=0; found=0 } FNR==1 { files++ } NR>1 && $2 ~ /:4ABC$/ { found=1 } END { if (files==0) print "Container UDP 19132 listener: unknown"; else if (found) print "Container UDP 19132 listener: yes"; else print "Container UDP 19132 listener: no" }'"'"' /proc/net/udp /proc/net/udp6 2>/dev/null
              awk '"'"'BEGIN { files=0; found=0 } FNR==1 { files++ } NR>1 && $2 ~ /:4ABC$/ && $4=="0A" { found=1 } END { if (files==0) print "Container TCP 19132 listener: unknown"; else if (found) print "Container TCP 19132 listener: yes"; else print "Container TCP 19132 listener: no" }'"'"' /proc/net/tcp /proc/net/tcp6 2>/dev/null
            ' 2>/dev/null || true
          else
            echo 'Geyser configuration file: not found'
          fi
          echo '=== PUBLISHED PORTS ==='
          docker port mc-server 2>/dev/null | sed -n -E 's/^([0-9]+\/(tcp|udp)) -> .*/Published container port: \1/p' | sort -u || true
          echo '=== SSH EFFECTIVE AUTHENTICATION POLICY ==='
          if command -v sshd >/dev/null 2>&1; then
            if sshd -T 2>/dev/null | grep -Eq '^(passwordauthentication|permitrootlogin|pubkeyauthentication|kbdinteractiveauthentication|authenticationmethods|usepam|maxauthtries) '; then
              echo 'SSH effective authentication policy: collected (values withheld)'
            else
              echo 'SSH effective authentication policy: unavailable'
            fi
          else
            echo 'sshd: unavailable'
          fi
          echo '=== SSH / FAIL2BAN SERVICE STATE ==='
          for SVC in ssh sshd fail2ban; do
            STATE=$(systemctl is-active "$SVC" 2>/dev/null || true)
            if [ -n "$STATE" ]; then echo "$SVC: $STATE"; fi
          done
          if command -v fail2ban-client >/dev/null 2>&1 && systemctl is-active --quiet fail2ban 2>/dev/null; then
            fail2ban-client status 2>/dev/null | sed -n -E 's/^Status[[:space:]]*$/Status: available/p; s/^[[:space:]]*Number of jail:[[:space:]]*/Jails configured: /p'
          fi
          EOS
          )
          if ! az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --scripts "$SCRIPT" --query 'value[0].message' -o tsv > guest.txt 2>/dev/null; then
            echo 'Guest diagnostics: read denied or unavailable' > guest.txt
            AUDIT_COMPLETE=false
            add_audit_reason guest_diagnostics_unavailable
          fi
          if [ ! -s guest.txt ]; then
            AUDIT_COMPLETE=false
            add_audit_reason guest_output_empty
          fi
          if grep -Fq 'Geyser configuration file: not found' guest.txt; then
            AUDIT_COMPLETE=false
            add_audit_reason geyser_config_missing
          fi
          printf -v AUDIT_REASON_LIST '%s,' "${AUDIT_REASONS[@]}"
          AUDIT_REASON_LIST="${AUDIT_REASON_LIST%,}"
          echo "Audit completeness: $AUDIT_COMPLETE" >> report.txt
          GEYSER_BEDROCK_PORT=$(sed -n -E 's/^Geyser Bedrock port: ([0-9]{1,5})$/\1/p' guest.txt | head -n 1)
          GEYSER_TRANSPORT=$(sed -n -E 's/^Geyser transport: (UDP|TCP|WEBRTC|AUTO|OTHER)$/\1/p' guest.txt | head -n 1)
          GEYSER_WEBRTC_PORT=$(sed -n -E 's/^Geyser WebRTC port: ([0-9]{1,5})$/\1/p' guest.txt | head -n 1)
          GEYSER_CLONE_REMOTE=$(sed -n -E 's/^Geyser clone remote port: (true|false)$/\1/p' guest.txt | head -n 1)
          GEYSER_DIRECT_CONNECTION=$(sed -n -E 's/^Geyser direct connection: (true|false)$/\1/p' guest.txt | head -n 1)
          PUBLISHED_PORTS=$(sed -n -E 's/^Published container port: ([0-9]{1,5}\/(tcp|udp))$/\1/p' guest.txt | sort -u | paste -sd, -)
          BEDROCK_UDP_LISTENER=$(sed -n -E 's/^Container UDP 19132 listener: (yes|no|unknown)$/\1/p' guest.txt | head -n 1)
          BEDROCK_TCP_LISTENER=$(sed -n -E 's/^Container TCP 19132 listener: (yes|no|unknown)$/\1/p' guest.txt | head -n 1)
          echo "audit_complete=$AUDIT_COMPLETE" >> "$GITHUB_OUTPUT"
          echo "audit_reasons=$AUDIT_REASON_LIST" >> "$GITHUB_OUTPUT"
          echo "geyser_bedrock_port=$GEYSER_BEDROCK_PORT" >> "$GITHUB_OUTPUT"
          echo "geyser_transport=$GEYSER_TRANSPORT" >> "$GITHUB_OUTPUT"
          echo "geyser_webrtc_port=$GEYSER_WEBRTC_PORT" >> "$GITHUB_OUTPUT"
          echo "geyser_clone_remote=$GEYSER_CLONE_REMOTE" >> "$GITHUB_OUTPUT"
          echo "geyser_direct_connection=$GEYSER_DIRECT_CONNECTION" >> "$GITHUB_OUTPUT"
          echo "published_ports=$PUBLISHED_PORTS" >> "$GITHUB_OUTPUT"
          echo "bedrock_udp_listener=$BEDROCK_UDP_LISTENER" >> "$GITHUB_OUTPUT"
          echo "bedrock_tcp_listener=$BEDROCK_TCP_LISTENER" >> "$GITHUB_OUTPUT"
          echo "nic_rule_summary=$NIC_RULE_SUMMARY" >> "$GITHUB_OUTPUT"
          echo "subnet_rule_summary=$SUBNET_RULE_SUMMARY" >> "$GITHUB_OUTPUT"
          # Raw Azure and guest output stays on the ephemeral runner and is never exported.
      - uses: actions/github-script@v7
        env:
          AUDIT_COMPLETE: ${{ steps.diag.outputs.audit_complete }}
          AUDIT_REASONS: ${{ steps.diag.outputs.audit_reasons }}
          NIC_RULE_SUMMARY: ${{ steps.diag.outputs.nic_rule_summary }}
          SUBNET_RULE_SUMMARY: ${{ steps.diag.outputs.subnet_rule_summary }}
          GEYSER_BEDROCK_PORT: ${{ steps.diag.outputs.geyser_bedrock_port }}
          GEYSER_TRANSPORT: ${{ steps.diag.outputs.geyser_transport }}
          GEYSER_WEBRTC_PORT: ${{ steps.diag.outputs.geyser_webrtc_port }}
          GEYSER_CLONE_REMOTE: ${{ steps.diag.outputs.geyser_clone_remote }}
          GEYSER_DIRECT_CONNECTION: ${{ steps.diag.outputs.geyser_direct_connection }}
          PUBLISHED_PORTS: ${{ steps.diag.outputs.published_ports }}
          BEDROCK_UDP_LISTENER: ${{ steps.diag.outputs.bedrock_udp_listener }}
          BEDROCK_TCP_LISTENER: ${{ steps.diag.outputs.bedrock_tcp_listener }}
        with:
          script: |
            const complete = process.env.AUDIT_COMPLETE === 'true';
            const heading = complete ? '## Azure / Geyser read-only audit — complete' : '## Azure / Geyser read-only audit — incomplete';
            const note = complete
              ? 'All required read-only checks completed. Detailed infrastructure output is intentionally withheld.'
              : 'At least one required Azure or guest read was denied or unavailable. Detailed infrastructure output is intentionally withheld; keep this issue open.';
            const allowed = new Set([
              'vm_nic_read_unavailable',
              'role_assignment_read_unavailable',
              'nic_nsg_rules_unavailable',
              'subnet_authorization_denied',
              'subnet_resource_not_found',
              'subnet_subscription_unavailable',
              'subnet_provider_unavailable',
              'subnet_read_error_unknown',
              'subnet_nsg_rules_unavailable',
              'guest_diagnostics_unavailable',
              'guest_output_empty',
              'geyser_config_missing',
            ]);
            const reasons = (process.env.AUDIT_REASONS || '')
              .split(',')
              .filter(reason => allowed.has(reason));
            const diagnostic = reasons.length
              ? '\n\nSafe diagnostic categories: ' + [...new Set(reasons)].join(', ') + '.'
              : '';
            const safeRules = raw => {
              try {
                const parsed = JSON.parse(raw || '[]');
                if (!Array.isArray(parsed)) return [];
                const overlapsMinecraftPorts = value => {
                  const entries = Array.isArray(value) ? value : [value];
                  return entries.some(entry => {
                    if (typeof entry !== 'string') return false;
                    if (entry === '*' || entry.toLowerCase() === 'any') return true;
                    return entry.split(',').some(part => {
                      const match = part.trim().match(/^(\d+)(?:-(\d+))?$/);
                      if (!match) return false;
                      const low = Number(match[1]);
                      const high = Number(match[2] || match[1]);
                      return (low <= 25565 && high >= 25565) || (low <= 19132 && high >= 19132);
                    });
                  });
                };
                return parsed.filter(rule => overlapsMinecraftPorts(rule.destinationPortRange) ||
                  overlapsMinecraftPorts(rule.destinationPortRanges)).slice(0, 50).map(rule => {
                    const access = ['Allow', 'Deny'].includes(rule.access) ? rule.access : 'unknown';
                    const rawProtocol = typeof rule.protocol === 'string' ? rule.protocol.toUpperCase() : '';
                    const protocol = ['TCP', 'UDP', 'ICMP', 'ESP', 'AH', '*', 'ANY'].includes(rawProtocol) ? rawProtocol : 'other';
                    const portText = value => {
                      const entries = Array.isArray(value) ? value : [value];
                      return entries.filter(v => typeof v === 'string' && /^[0-9*,\-\s]+$/.test(v)).join(', ') || 'wildcard/other';
                    };
                    const scope = ['ANY/INTERNET', 'AZURE SERVICE SCOPE', 'RESTRICTED (CIDRs redacted)', 'UNSPECIFIED'].includes(rule.sourceScope) ? rule.sourceScope : 'UNSPECIFIED';
                    const destinationValue = Array.isArray(rule.destinationPortRanges) && rule.destinationPortRanges.length ? rule.destinationPortRanges : rule.destinationPortRange;
                    return {access, protocol, destination: portText(destinationValue), scope};
                  });
              } catch {
                return [];
              }
            };
            const describeRules = (label, rules) => {
              if (!rules.length) return label + ': no matching inbound Minecraft-port or wildcard rules reported.';
              return label + ': ' + rules.map((r, i) =>
                (i + 1) + ') ' + r.access + ' ' + r.protocol + ' destination ' + r.destination + '; source ' + r.scope
              ).join(' | ');
            };
            const ruleSummary = '\n\n' + describeRules('NIC NSG', safeRules(process.env.NIC_RULE_SUMMARY)) +
              '\n' + describeRules('Subnet NSG', safeRules(process.env.SUBNET_RULE_SUMMARY));
            const safePort = value => /^\d{1,5}$/.test(value || '') && Number(value) >= 1 && Number(value) <= 65535 ? value : '';
            const safeBool = value => value === 'true' || value === 'false' ? value : '';
            const safeTransport = ['UDP', 'TCP', 'WEBRTC', 'AUTO', 'OTHER'].includes(process.env.GEYSER_TRANSPORT) ? process.env.GEYSER_TRANSPORT : '';
            const geyserDetails = [];
            if (safePort(process.env.GEYSER_BEDROCK_PORT)) geyserDetails.push('Bedrock listener port: ' + safePort(process.env.GEYSER_BEDROCK_PORT));
            if (safeTransport) geyserDetails.push('Geyser transport: ' + safeTransport);
            if (safePort(process.env.GEYSER_WEBRTC_PORT)) geyserDetails.push('WebRTC port: ' + safePort(process.env.GEYSER_WEBRTC_PORT));
            if (safeBool(process.env.GEYSER_CLONE_REMOTE)) geyserDetails.push('Clone remote port: ' + safeBool(process.env.GEYSER_CLONE_REMOTE));
            if (safeBool(process.env.GEYSER_DIRECT_CONNECTION)) geyserDetails.push('Direct connection: ' + safeBool(process.env.GEYSER_DIRECT_CONNECTION));
            const published = (process.env.PUBLISHED_PORTS || '').split(',').filter(value => /^\d{1,5}\/(tcp|udp)$/.test(value));
            if (published.length) geyserDetails.push('Published container ports: ' + [...new Set(published)].join(', '));
            const socketState = value => ['yes', 'no', 'unknown'].includes(value) ? value : 'unknown';
            geyserDetails.push('Live UDP 19132 listener: ' + socketState(process.env.BEDROCK_UDP_LISTENER));
            geyserDetails.push('Live TCP 19132 listener: ' + socketState(process.env.BEDROCK_TCP_LISTENER));
            const transportSummary = geyserDetails.length ? '\n\nGeyser transport/config: ' + geyserDetails.join('; ') + '.' : '';
            const body = heading + '\n\n' + note + diagnostic + ruleSummary + transportSummary +
              '\n\nOnly sanitized Minecraft-port rule summaries are published. No rule names, priorities, source addresses, resource identifiers, raw command output, configuration values, or guest diagnostics are published.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state: complete ? 'closed' : 'open'});
