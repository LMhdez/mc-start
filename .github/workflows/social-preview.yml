name: Generate social preview PNG

on:
  push:
    branches: [main]
    paths:
      - "social-preview.svg"
      - "social-preview-en.svg"
      - "social-preview-es.svg"
      - ".github/workflows/social-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Render SVG as PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for locale in pt en es; do
            source="social-preview.svg"
            target="social-preview.png"
            if [ "$locale" = "en" ]; then
              source="social-preview-en.svg"
              target="social-preview-en.png"
            elif [ "$locale" = "es" ]; then
              source="social-preview-es.svg"
              target="social-preview-es.png"
            fi
            rsvg-convert --format=png --width=1200 --height=630 "$source" > "$target"
            file "$target"
          done
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png social-preview-en.png social-preview-es.png
          if git diff --cached --quiet; then
            echo "PNG already up to date"
            exit 0
          fi
          git commit -m "Build social preview PNG"
          git push
