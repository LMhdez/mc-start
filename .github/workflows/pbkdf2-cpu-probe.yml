name: Temporary PBKDF2 Free CPU probe

on:
  push:
    branches:
      - test/pbkdf2-cpu-runtime

permissions:
  contents: read

jobs:
  runtime-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Repeat isolated Cloudflare Free Worker test
        shell: bash
        run: |
          for n in 1 2 3 4 5; do
            status="$(curl --silent --show-error --output "/tmp/probe-$n" --write-out '%{http_code}' --max-time 20 'https://mc-start-pbkdf2-probe-20261101.luismariohernandezsantos.workers.dev/')"
            python3 - "$n" "$status" "/tmp/probe-$n" <<'PY'
          import json, pathlib, sys
          n, status, path = sys.argv[1:]
          body = pathlib.Path(path).read_text(errors="replace")
          try:
              data = json.loads(body)
              print(f"RUN={n} HTTP={status} OK={data.get('ok')} ERROR={data.get('error')}")
          except Exception:
              print(f"RUN={n} HTTP={status} BODY={body[:160].replace(chr(10), ' ')}")
          PY
          done
