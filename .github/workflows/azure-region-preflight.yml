name: Azure Madrid SKU preflight

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  preflight:
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-REGION]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Login Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify VM and disk SKU metadata (read-only)
        id: sku
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          LOCATION=spaincentral
          VM_SIZE=Standard_B2als_v2
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          inspect_sku() {
            local resource_type="$1" target_name="$2" output_file="$3"
            shift 3
            if ! timeout --signal=TERM --kill-after=5s 75s az vm list-skus \
              --location "$LOCATION" --resource-type "$resource_type" "$@" -o json \
              >"$output_file" 2>/dev/null; then
              printf 'QUERY_TIMEOUT_OR_ERROR'
              return
            fi
            python3 - "$target_name" "$output_file" <<'PY'
          import json,sys
          target,path=sys.argv[1],sys.argv[2]
          try:
              data=json.load(open(path,encoding="utf-8"))
          except Exception:
              print("INVALID_RESPONSE")
              raise SystemExit(0)
          items=data if isinstance(data,list) else data.get("value",[])
          matches=[x for x in items if x.get("name")==target]
          if not matches:
              print("NOT_LISTED")
              raise SystemExit(0)
          reasons=set()
          zone_only=True
          for item in matches:
              for restriction in item.get("restrictions",[]) or []:
                  reasons.add(str(restriction.get("reasonCode") or restriction.get("type") or "RESTRICTED"))
                  if str(restriction.get("type","")).lower()!="zone":
                      zone_only=False
          if not reasons:
              print("LISTED_NO_RESTRICTIONS")
          elif zone_only:
              print("LISTED_ZONE_RESTRICTIONS_ONLY")
          else:
              print("LISTED_WITH_RESTRICTIONS:" + ",".join(sorted(reasons))[:160])
          PY
          }

          # Without --all, Azure returns SKUs available to this subscription in this region.
          VM_STATUS=$(inspect_sku virtualMachines "$VM_SIZE" "$TMP_DIR/vm.json" --size "$VM_SIZE")
          DISK_STATUS=$(inspect_sku disks Premium_LRS "$TMP_DIR/disk.json")
          echo "vm_sku_status=$VM_STATUS" >> "$GITHUB_OUTPUT"
          echo "disk_sku_status=$DISK_STATUS" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        env:
          VM_SKU_STATUS: ${{ steps.sku.outputs.vm_sku_status }}
          DISK_SKU_STATUS: ${{ steps.sku.outputs.disk_sku_status }}
        with:
          script: |
            const allowed = value => /^[A-Z0-9_:,-]{1,180}$/.test(value || '') ? value : 'UNKNOWN';
            const vm = allowed(process.env.VM_SKU_STATUS);
            const disk = allowed(process.env.DISK_SKU_STATUS);
            const body = [
              '## Madrid Azure SKU preflight — read-only',
              '',
              'VM Standard_B2als_v2: ' + vm,
              'OS disk Premium_LRS: ' + disk,
              '',
              'The query omits --all and checks SKUs returned as available to this subscription in Spain Central. NOT_LISTED is not treated as confirmation. This metadata does not guarantee physical capacity, allocation success, credit balance, or zero personal cost. No Azure resources were created or changed.',
              '',
              'Provisioning remains blocked until the SKU and disk are confirmed as usable, the full cost is covered by Azure for Students credits, and the user explicitly approves the maximum credit consumption. Personal spend must remain 0 €.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            const confirmed = ['LISTED_NO_RESTRICTIONS','LISTED_ZONE_RESTRICTIONS_ONLY'].includes(vm) &&
              ['LISTED_NO_RESTRICTIONS','LISTED_ZONE_RESTRICTIONS_ONLY'].includes(disk);
            if (confirmed) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
