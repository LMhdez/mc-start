name: Build Essential Commands with MC SERVER AFK policy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/patch-essential-commands-afk.py'
      - '.github/workflows/build-essential-commands-afk.yml'

permissions:
  contents: read

concurrency:
  group: essential-commands-afk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout MC SERVER build scripts
        uses: actions/checkout@v4

      - name: Checkout pinned Essential Commands source
        uses: actions/checkout@v4
        with:
          repository: John-Paul-R/Essential-Commands
          ref: 29df7933e95f788c450698b8be0656f0c6afedb0
          path: essential-commands

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply AFK policy patch
        working-directory: essential-commands
        run: |
          set -euo pipefail
          test "$(grep '^mod_version[[:space:]]*=' gradle.properties | cut -d= -f2 | tr -d ' ')" = "0.42.0"
          python3 ../scripts/patch-essential-commands-afk.py
          sed -i 's/^mod_version[[:space:]]*=.*/mod_version = 0.42.0-afk1/' gradle.properties
          grep -q 'AFK_KICK_WARNING_TICKS = 20 \* 60 \* 25' src/main/java/com/fibermc/essentialcommands/playerdata/PlayerData.java
          grep -q 'AFK_KICK_TICKS = 20 \* 60 \* 30' src/main/java/com/fibermc/essentialcommands/playerdata/PlayerData.java
          grep -q 'afk.kickexempt' src/main/java/com/fibermc/essentialcommands/playerdata/PlayerData.java

      - name: Build and run tests
        working-directory: essential-commands
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Verify built mod metadata and artifact
        working-directory: essential-commands
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'essential_commands-0.42.0-afk1-mc26.3*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)"
          test -n "$JAR"
          python3 - "$JAR" <<'PY'
          import json, sys, zipfile
          jar = sys.argv[1]
          with zipfile.ZipFile(jar) as archive:
              metadata = json.loads(archive.read("fabric.mod.json"))
          assert metadata["id"] == "essential_commands", metadata
          assert metadata["version"].startswith("0.42.0-afk1-mc26.3"), metadata
          print("Verified mod:", metadata["id"], metadata["version"])
          PY
          mkdir -p ../afk-build-output
          cp "$JAR" ../afk-build-output/

      - name: Upload custom mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: essential-commands-26.3-afk1
          path: afk-build-output/*.jar
          if-no-files-found: error
          retention-days: 14
