name: Temporary deploy MC readiness agent
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  deploy:
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-AGENT-DEPLOY]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Start temporarily, deploy agent, restore original VM state
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          STARTED_BY_WORKFLOW=0
          cleanup() {
            if [[ "$STARTED_BY_WORKFLOW" == "1" ]]; then
              echo "Restoring original deallocated state..."
              az vm deallocate -g "$RG" -n "$VM" --no-wait || true
            fi
          }
          trap cleanup EXIT

          STATE=$(az vm get-instance-view -g "$RG" -n "$VM" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv)
          if [[ "$STATE" == "VM deallocated" || "$STATE" == "VM stopped" ]]; then
            STARTED_BY_WORKFLOW=1
            az vm start -g "$RG" -n "$VM"
          elif [[ "$STATE" != "VM running" ]]; then
            echo "Unexpected VM state: $STATE. Aborting without changes."
            exit 1
          fi

          READY=0
          for attempt in $(seq 1 36); do
            STATE=$(az vm get-instance-view -g "$RG" -n "$VM" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv)
            if [[ "$STATE" == "VM running" ]]; then READY=1; break; fi
            sleep 10
          done
          if [[ "$READY" != "1" ]]; then echo "VM did not reach running state."; exit 1; fi

          AGENT_B64=$(base64 -w0 vm/mc-agent.py)
          SCRIPT="set -eu
          TARGET=/opt/mc-agent/mc-agent.py
          TMP=\$(mktemp /opt/mc-agent/mc-agent.py.XXXXXX)
          BACKUP=/opt/mc-agent/mc-agent.py.rollback.\$\$
          HAD_OLD=0
          if [ -f \"\$TARGET\" ]; then cp -p \"\$TARGET\" \"\$BACKUP\"; HAD_OLD=1; fi
          trap 'rm -f \"\$TMP\"' EXIT
          printf '%s' '$AGENT_B64' | base64 -d > \"\$TMP\"
          chmod 0755 \"\$TMP\"
          python3 -c 'import pathlib,sys; compile(pathlib.Path(sys.argv[1]).read_text(encoding=\"utf-8\"), sys.argv[1], \"exec\")' \"\$TMP\"
          mv -f \"\$TMP\" \"\$TARGET\"
          if ! systemctl restart mc-private-agent.service || ! systemctl is-active --quiet mc-private-agent.service || ! python3 -c 'import json,urllib.request; d=json.load(urllib.request.urlopen(\"http://127.0.0.1:8765/status\",timeout=30)); r=d.get(\"result\",{}); assert d.get(\"ok\") is True and \"geyser_ready\" in r and \"rcon_ready\" in r'; then
            echo AGENT_DEPLOY_ROLLBACK
            if [ \"\$HAD_OLD\" = 1 ]; then mv -f \"\$BACKUP\" \"\$TARGET\"; systemctl restart mc-private-agent.service || true; else rm -f \"\$TARGET\"; fi
            exit 1
          fi
          rm -f \"\$BACKUP\"
          echo AGENT_READINESS_DEPLOY_OK"
          RESULT=$(az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --scripts "$SCRIPT" --query "value[].message" -o tsv)
          printf '%s\\n' "$RESULT"
          grep -q AGENT_READINESS_DEPLOY_OK <<< "$RESULT"
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'Readiness agent deployed and verified. Minecraft container was not restarted. VM will return to its original deallocated state.'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});
