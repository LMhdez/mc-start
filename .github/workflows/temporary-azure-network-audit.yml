name: Temporary Azure network and Geyser config audit
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-NET]')
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Inspect effective NSG and Geyser config
        id: diag
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -eu
          echo '=== VM / NIC NETWORK PROFILE ===' > report.txt
          NIC_IDS=$(az vm show -g "$RG" -n "$VM" --query 'networkProfile.networkInterfaces[].id' -o tsv)
          if [ -z "$NIC_IDS" ]; then echo 'No NIC IDs returned' >> report.txt; fi
          for NIC in $NIC_IDS; do
            echo "NIC: $(basename "$NIC")" >> report.txt
            az network nic list-effective-nsg --ids "$NIC" -o json > effective-nsg.json 2>nsg-error.txt || { echo 'Effective NSG query failed' >> report.txt; cat nsg-error.txt >> report.txt; continue; }
            python3 - <<'PY' >> report.txt
import json
data=json.load(open('effective-nsg.json'))
items=data if isinstance(data,list) else data.get('value',[])
found=0
for item in items:
  rules=item.get('effectiveSecurityRules',[])
  for r in rules:
    dp=str(r.get('destinationPortRange', r.get('destinationPortRanges','')))
    sp=str(r.get('sourcePortRange', r.get('sourcePortRanges','')))
    if '19132' in dp or dp in ('*','[*]'):
      print('RULE name=%s access=%s direction=%s protocol=%s priority=%s dest=%s source=%s' % (r.get('name'),r.get('access'),r.get('direction'),r.get('protocol'),r.get('priority'),dp,sp))
      found+=1
print('Relevant effective rules:',found)
PY
          done
          echo '=== VM PUBLIC IP ASSOCIATION (NO ADDRESS VALUES) ===' >> report.txt
          for NIC in $NIC_IDS; do
            az network nic show --ids "$NIC" --query 'ipConfigurations[].{name:name,hasPublicIp:publicIpAddress.id!=null,subnet:subnet.id}' -o json >> report.txt 2>/dev/null || true
          done
          echo '=== GATEWAY / GUEST CONFIG DISCOVERY ===' >> report.txt
          SCRIPT=$(cat <<'EOS'
          echo '--- Geyser-related files ---'
          docker exec mc-server sh -c 'find /data /config /plugins -type f 2>/dev/null | grep -Ei "geyser.*(yml|yaml)|config.*(yml|yaml)" | head -40' || true
          echo '--- Safe Geyser config keys ---'
          docker exec mc-server sh -c '
            find /data /config /plugins -type f \( -iname "*.yml" -o -iname "*.yaml" \) 2>/dev/null | while read f; do
              if grep -qi geyser "$f" 2>/dev/null || echo "$f" | grep -qi geyser; then
                echo "FILE=$f"
                grep -nEi "^[[:space:]]*(bedrock:|port:|clone-remote-port:|broadcast-port:|address:|transport:|webrtc-port:|signaling:|mode:|use-direct-connection:|enable-proxy-protocol:|motd1:|motd2:)" "$f" 2>/dev/null || true
              fi
            done
          ' 2>&1 | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/[IP REDACTED]/g'
          echo '--- Docker published ports ---'
          docker port mc-server 2>&1 || true
          EOS
          )
          az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --scripts "$SCRIPT" --query 'value[0].message' -o tsv > guest.txt
          cat guest.txt >> report.txt
          { echo 'report<<EOF'; cat report.txt; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.diag.outputs.report }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'## Azure network / Geyser audit\n\n```text\n'+(process.env.REPORT||'No report')+'\n```'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});