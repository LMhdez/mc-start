name: Diagnosticar NetherNet (Geyser)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc-server-vm-operations
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Login na Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Diagnosticar rede e Geyser sem alterar configuração
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail

          get_status() {
            az vm get-instance-view --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv
          }

          INITIAL_STATUS="$(get_status)"
          STARTED_BY_WORKFLOW=0
          cleanup_vm() {
            if [[ "$STARTED_BY_WORKFLOW" == "1" ]]; then
              echo "A restaurar o estado inicial da VM: $INITIAL_STATUS"
              if [[ "$INITIAL_STATUS" == "VM stopped" ]]; then
                az vm stop -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM_NAME" --no-wait || true
                TARGET="VM stopped"
              else
                az vm deallocate -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM_NAME" --no-wait || true
                TARGET="VM deallocated"
              fi
              for i in {1..90}; do
                CURRENT="$(get_status)"
                if [[ "$CURRENT" == "$TARGET" ]]; then
                  echo "VM_STATE_RESTORED=$TARGET"
                  return 0
                fi
                sleep 10
              done
              echo "AVISO: não foi possível confirmar a reposição do estado inicial ($TARGET)."
            fi
          }
          trap cleanup_vm EXIT

          echo "INITIAL_VM_STATUS=$INITIAL_STATUS"
          if [[ "$INITIAL_STATUS" == "VM deallocated" || "$INITIAL_STATUS" == "VM stopped" ]]; then
            STARTED_BY_WORKFLOW=1
            az vm start -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM_NAME" --no-wait
          elif [[ "$INITIAL_STATUS" != "VM running" ]]; then
            echo "Estado inesperado da VM: $INITIAL_STATUS"
            exit 1
          fi

          for i in {1..90}; do
            CURRENT="$(get_status)"
            [[ "$CURRENT" == "VM running" ]] && break
            sleep 10
          done
          [[ "$CURRENT" == "VM running" ]] || { echo "VM não iniciou."; exit 1; }

          VM_JSON="$(az vm show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM_NAME" -d -o json)"
          printf '%s' "$VM_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("PUBLIC_IP="+str(d.get("publicIps") or "none")); print("PRIVATE_IP="+str(d.get("privateIps") or "none")); print("VM_ID="+str(d.get("id") or "unknown"))'
          NIC_IDS="$(az vm show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM_NAME" --query "networkProfile.networkInterfaces[].id" -o tsv)"
          for NIC_ID in $NIC_IDS; do
            echo "NIC=$NIC_ID"
            az network nic show --ids "$NIC_ID" --query "{name:name,nsg:networkSecurityGroup.id,subnetNsg:ipConfigurations[0].subnet.id}" -o json
          done
          az network nsg list -o json | python3 -c '
          import json,sys
          for n in json.load(sys.stdin):
            matches=[]
            for r in n.get("securityRules",[]):
              ports=[str(r.get("destinationPortRange",""))]+[str(x) for x in r.get("destinationPortRanges",[])]
              if any(p=="19132" or p=="*" for p in ports):
                matches.append({k:r.get(k) for k in ("name","priority","direction","access","protocol","sourceAddressPrefix","sourceAddressPrefixes","destinationPortRange","destinationPortRanges")})
            if matches: print(json.dumps({"nsg":n.get("name"),"id":n.get("id"),"rules":matches},ensure_ascii=False))
          '

          SCRIPT=$(cat <<'REMOTE'
          set -eu
          C=mc-server
          echo "=== CONTAINER ==="
          docker inspect "$C" --format 'STATUS={{.State.Status}}'
          docker port "$C" 2>/dev/null | grep -E '19132|25565' || true
          echo "=== GEYSER JARS ==="
          docker exec "$C" sh -lc 'find /data/mods -maxdepth 1 -type f -iname "*geyser*.jar" -printf "%f\n" 2>/dev/null || true'
          echo "=== GEYSER CONFIG (BEDROCK/SIGNALING ONLY) ==="
          F=$(docker exec "$C" sh -lc 'find /data/config -maxdepth 3 -type f -path "*/Geyser-Fabric/config.yml" -print -quit 2>/dev/null || true')
          if [ -n "$F" ]; then
            echo "CONFIG_PATH=$F"
            docker exec "$C" sh -lc '
              awk "
                /^bedrock:/ {show=1; count=0}
                show {print; count++}
                show && count>0 && /^[^[:space:]#][^:]*:/ && \$0 !~ /^bedrock:/ {exit}
              " "$1" | head -n 100
            ' sh "$F"
          else
            echo "GEYSER_CONFIG_NOT_FOUND"
          fi
          echo "=== HOST UDP LISTENERS ==="
          ss -lunp 2>/dev/null | grep -E '(:19132)([[:space:]]|$)' || true
          echo "=== HOST FIREWALL ==="
          if command -v ufw >/dev/null 2>&1; then ufw status verbose 2>&1 | head -n 35; else echo "UFW_NOT_INSTALLED"; fi
          echo "=== DOCKER NETWORK PORTS ==="
          docker inspect "$C" --format '{{json .HostConfig.PortBindings}}'
          echo "=== RECENT GEYSER LOGS ==="
          docker logs --tail 500 "$C" 2>&1 | grep -iE 'geyser|nethernet|19132|signaling|webrtc|raknet' | tail -n 80 || true
          echo NETHERNET_DIAGNOSTIC_OK
          REMOTE
          )

          RESULT="$(az vm run-command invoke -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM_NAME" --command-id RunShellScript --scripts "$SCRIPT" --query "value[].message" -o tsv)"
          printf '%s\n' "$RESULT"
          grep -q "NETHERNET_DIAGNOSTIC_OK" <<< "$RESULT"
