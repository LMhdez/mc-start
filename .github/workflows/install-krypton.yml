name: Instalar Krypton no servidor Minecraft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc-server-vm-operations
  cancel-in-progress: false

jobs:
  install-krypton:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Login na Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verificar VM e instalar Krypton com backup
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail

          get_status() {
            az vm get-instance-view \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_VM_NAME" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" \
              -o tsv
          }

          STATUS=$(get_status)
          INITIAL_STATUS="$STATUS"
          STARTED_BY_WORKFLOW=0

          cleanup_vm() {
            if [[ "$STARTED_BY_WORKFLOW" == "1" ]]; then
              TARGET_STATUS="VM deallocated"
              if [[ "$INITIAL_STATUS" == "VM stopped" ]]; then
                TARGET_STATUS="VM stopped"
                echo "A repor o estado inicial: a VM será parada sem desalocação."
                az vm stop --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME" --no-wait || true
              else
                echo "A repor o estado inicial: a VM será desalocada."
                az vm deallocate --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME" --no-wait || true
              fi
              for i in {1..90}; do
                STATUS=$(get_status)
                if [[ "$STATUS" == "$TARGET_STATUS" ]]; then
                  echo "Estado inicial da VM restaurado: $TARGET_STATUS."
                  return 0
                fi
                sleep 10
              done
              echo "Aviso: não foi possível confirmar a reposição do estado inicial ($TARGET_STATUS)."
            fi
          }
          trap cleanup_vm EXIT

          if [[ "$STATUS" == "VM deallocated" || "$STATUS" == "VM stopped" ]]; then
            STARTED_BY_WORKFLOW=1
            echo "VM estava desligada; a iniciar temporariamente para instalar o mod."
            az vm start --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME" --no-wait
          elif [[ "$STATUS" != "VM running" ]]; then
            echo "A VM está num estado transitório ou inesperado: $STATUS"
            exit 1
          fi

          for i in {1..90}; do
            STATUS=$(get_status)
            if [[ "$STATUS" == "VM running" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$STATUS" != "VM running" ]]; then
            echo "A VM não ficou operacional dentro do tempo limite (estado: $STATUS)."
            exit 1
          fi

          SCRIPT=$(cat <<'REMOTE'
          set -eu
          CONTAINER="mc-server"
          VERSION_ID="UugdIYJw"
          WORKDIR=$(mktemp -d /tmp/mc-krypton.XXXXXX)
          mkdir -p /var/backups/minecraft
          BACKUP=$(mktemp -d "/var/backups/minecraft/mods-krypton-$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")
          CONTAINER_STOPPED=0
          INSTALL_APPLIED=0
          READY=0
          FILENAME=""
          cleanup() {
            if [ "$INSTALL_APPLIED" = "1" ] && [ "$READY" -ne 1 ]; then
              DATA_SOURCE=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Source}}{{end}}{{end}}' "$CONTAINER" 2>/dev/null || true)
              if [ -n "$DATA_SOURCE" ] && [ "$DATA_SOURCE" != "/" ] && [ -d "$DATA_SOURCE/mods" ]; then
                echo "O arranque falhou; a remover apenas o JAR acabado de instalar e a restaurar o servidor."
                docker stop --time 30 "$CONTAINER" >/dev/null 2>&1 || true
                rm -f "$DATA_SOURCE/mods/$FILENAME"
                if docker start "$CONTAINER" >/dev/null 2>&1; then
                  echo "Rollback aplicado e contentor reiniciado. Backup preservado em $BACKUP."
                else
                  echo "Rollback aplicado, mas o contentor não iniciou. Backup preservado em $BACKUP."
                fi
              else
                echo "Não foi possível identificar com segurança o volume /data para rollback automático. Backup preservado em $BACKUP."
              fi
            elif [ "$CONTAINER_STOPPED" = "1" ]; then
              docker start "$CONTAINER" >/dev/null 2>&1 || true
            fi
            rm -rf "$WORKDIR"
          }
          trap cleanup EXIT

          docker inspect "$CONTAINER" >/dev/null
          STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER")
          if [ "$STATE" != "running" ]; then
            echo "Container Minecraft não está em execução: $STATE"
            exit 1
          fi

          PLAYERS=""
          RCON_READY=0
          for i in $(seq 1 90); do
            PLAYERS=$(docker exec "$CONTAINER" rcon-cli list 2>/dev/null || true)
            if printf '%s\n' "$PLAYERS" | grep -qE 'There are [0-9]+ of'; then
              RCON_READY=1
              break
            fi
            sleep 2
          done
          if [ "$RCON_READY" -ne 1 ]; then
            echo "RCON não ficou disponível após o arranque da VM; nenhum ficheiro foi alterado."
            exit 1
          fi

          COUNT=$(printf '%s' "$PLAYERS" | sed -nE 's/.*There are ([0-9]+) of.*/\1/p' | head -n1)
          if [ -z "$COUNT" ]; then
            echo "Não foi possível interpretar a resposta RCON; instalação cancelada."
            exit 1
          fi
          case "$COUNT" in *[!0-9]*)
            echo "Contagem RCON inválida; instalação cancelada."
            exit 1
            ;;
          esac
          if [ "$COUNT" -gt 0 ]; then
            echo "Instalação adiada: existem $COUNT jogador(es) online. Nenhum jogador foi desligado."
            exit 2
          fi

          EXISTING=$(docker exec "$CONTAINER" sh -lc "find /data/mods -maxdepth 1 -type f -iname '*krypton*.jar' -print -quit" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "Krypton já está instalado em /data/mods: $EXISTING"
            echo "KRYPTON_INSTALL_OK"
            exit 0
          fi

          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            -H "User-Agent: LMhdez/mc-start/1.0" \
            "https://api.modrinth.com/v2/version/$VERSION_ID" \
            -o "$WORKDIR/version.json"

          python3 - "$WORKDIR/version.json" "$WORKDIR/download-url" "$WORKDIR/filename" "$WORKDIR/sha512" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("version_number") != "0.3.2" or "26.3" not in data.get("game_versions", []) or "fabric" not in data.get("loaders", []):
              raise SystemExit("A versão Modrinth não corresponde a Krypton 0.3.2 / Minecraft 26.3 / Fabric.")
          files = data.get("files", [])
          primary = next((f for f in files if f.get("primary")), files[0] if files else None)
          if not primary or not primary.get("url", "").startswith("https://cdn.modrinth.com/"):
              raise SystemExit("Ficheiro oficial do Krypton não encontrado.")
          filename = primary.get("filename", "")
          sha512 = (primary.get("hashes") or {}).get("sha512", "")
          if not filename.endswith(".jar") or "/" in filename or "\\" in filename or len(sha512) != 128:
              raise SystemExit("Metadados do ficheiro Krypton inválidos.")
          open(sys.argv[2], "w").write(primary["url"])
          open(sys.argv[3], "w").write(filename)
          open(sys.argv[4], "w").write(sha512)
          PY

          URL=$(cat "$WORKDIR/download-url")
          FILENAME=$(cat "$WORKDIR/filename")
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 60 "$URL" -o "$WORKDIR/$FILENAME"
          EXPECTED_SHA512=$(cat "$WORKDIR/sha512")
          echo "$EXPECTED_SHA512  $WORKDIR/$FILENAME" | sha512sum --check --status || {
            echo "A verificação SHA-512 do ficheiro falhou; instalação cancelada."
            exit 1
          }

          docker cp "$CONTAINER:/data/mods" "$BACKUP/mods"
          echo "Backup criado: $BACKUP"
          docker exec "$CONTAINER" rcon-cli save-all flush
          docker stop --time 60 "$CONTAINER" >/dev/null
          CONTAINER_STOPPED=1
          docker cp "$WORKDIR/$FILENAME" "$CONTAINER:/data/mods/$FILENAME"
          INSTALL_APPLIED=1
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker start "$CONTAINER" >/dev/null
          CONTAINER_STOPPED=0

          READY=0
          for i in $(seq 1 90); do
            STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || true)
            if [ "$STATE" = "running" ]; then
              LOGS=$(docker logs --since "$STARTED_AT" --tail 250 "$CONTAINER" 2>&1 || true)
              if printf '%s\n' "$LOGS" | grep -qE 'Done \('; then
                READY=1
                break
              fi
              if printf '%s\n' "$LOGS" | grep -qiE 'Incompatible mods found|Failed to load|Mod resolution encountered an incompatible mod set|Exception in server'; then
                echo "O servidor apresentou um erro de arranque após a instalação. Backup preservado em $BACKUP."
                echo "$LOGS" | tail -n 80
                exit 1
              fi
            elif [ "$STATE" = "exited" ]; then
              echo "O container terminou durante o arranque. Backup preservado em $BACKUP."
              docker logs --tail 100 "$CONTAINER" 2>&1 || true
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "O servidor não confirmou o arranque dentro do tempo limite. Backup preservado em $BACKUP."
            docker logs --tail 100 "$CONTAINER" 2>&1 || true
            exit 1
          fi

          echo "KRYPTON_INSTALL_OK"
          echo "Versão: Krypton 0.3.2 (Fabric / Minecraft 26.3)"
          echo "Ficheiro: $FILENAME"
          echo "Backup: $BACKUP"
          REMOTE
          )

          RESULT=$(az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --command-id RunShellScript \
            --scripts "$SCRIPT" \
            --query "value[].message" \
            -o tsv)

          printf '%s\n' "$RESULT"
          grep -q "KRYPTON_INSTALL_OK" <<< "$RESULT"
