
name: Verificar Servidor Minecraft

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Identificador do pedido do painel"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Login na Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Recolher estado do servidor
        id: status
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          SSH_PRIVATE_KEY: ${{ secrets.MC_VM_SSH_PRIVATE_KEY }}

        run: |
          set -euo pipefail

          RESOURCE_GROUP="${AZURE_RESOURCE_GROUP:?Falta AZURE_RESOURCE_GROUP}"
          VM_NAME="${AZURE_VM_NAME:?Falta AZURE_VM_NAME}"

          VM_STATUS=$(az vm get-instance-view \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" \
            -o tsv)

          VM_STATUS="${VM_STATUS:-Unknown}"

          IP=""
          PORT_OPEN="false"
          DOCKER="unknown"
          CONTAINER="unknown"
          PLAYER_COUNT="0"
          PLAYER_NAMES="[]"
          ACCESS_METHOD="not_tested"

          if [ "$VM_STATUS" = "VM running" ]; then

            IP=$(az vm list-ip-addresses \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" \
              -o tsv 2>/dev/null || true)

            [ "$IP" = "None" ] && IP=""

            if [ -n "$IP" ] && timeout 5 bash -c "echo > /dev/tcp/$IP/25565" 2>/dev/null; then
              PORT_OPEN="true"
            fi

            REMOTE_STATUS=""

            # Tentar primeiro por SSH
            if [ -n "$IP" ] && [ -n "${SSH_PRIVATE_KEY:-}" ]; then

              KEY_FILE=$(mktemp)
              trap 'rm -f "$KEY_FILE"' EXIT

              printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
              chmod 600 "$KEY_FILE"

              echo "A tentar consultar a VM por SSH..."

              REMOTE_STATUS=$(timeout 20 ssh \
                -i "$KEY_FILE" \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=8 \
                "azureuser@$IP" \
                'sudo bash -s' <<'REMOTE' || true

          set -e

          DOCKER_STATE="inactive"
          CONTAINER_STATE="not_found"
          PLAYER_COUNT="0"
          PLAYER_NAMES=""

          if systemctl is-active --quiet docker; then
            DOCKER_STATE="active"
          fi

          if docker inspect mc-server >/dev/null 2>&1; then

            CONTAINER_STATE=$(docker inspect -f '{{.State.Status}}' mc-server)

            if [ "$CONTAINER_STATE" = "running" ]; then

              PLAYERS=$(timeout 8 docker exec mc-server rcon-cli list 2>/dev/null || true)

              PLAYER_COUNT=$(printf '%s\n' "$PLAYERS" |
                sed -n 's/.*There are \([0-9][0-9]*\) of.*/\1/p' |
                head -n1)

              PLAYER_NAMES=$(printf '%s\n' "$PLAYERS" |
                sed -n 's/.*players online: *//p' |
                tail -n1)

              if [ -z "$PLAYER_COUNT" ]; then
                PLAYER_COUNT="null"
                PLAYER_NAMES="null"
              elif [ "$PLAYER_COUNT" -gt 0 ] && [ -z "$PLAYER_NAMES" ]; then
                PLAYER_NAMES="null"
              fi

            fi
          fi

          export DOCKER_STATE CONTAINER_STATE PLAYER_COUNT PLAYER_NAMES

          python3 -c 'import json,os; print("MC_STATUS_JSON:" + json.dumps({"docker":os.environ["DOCKER_STATE"],"container":os.environ["CONTAINER_STATE"],"players":(int(os.environ["PLAYER_COUNT"]) if os.environ["PLAYER_COUNT"].isdigit() else None),"player_names":(None if os.environ["PLAYER_NAMES"] == "null" else [n.strip() for n in os.environ["PLAYER_NAMES"].split(",") if n.strip()])},separators=(",",":")))'

          REMOTE
              )

            fi

            # Se SSH falhar, utilizar Azure Run Command
            if [ -n "$REMOTE_STATUS" ]; then
              ACCESS_METHOD="ssh"
            fi

            if [ -z "$REMOTE_STATUS" ]; then

              echo "SSH indisponível. A utilizar Azure Run Command..."

              RUN_RESULT=$(az vm run-command invoke \
                --resource-group "$RESOURCE_GROUP" \
                --name "$VM_NAME" \
                --command-id RunShellScript \
                --scripts '
                  DOCKER_STATE="inactive"
                  CONTAINER_STATE="not_found"
                  PLAYER_COUNT="0"
                  PLAYER_NAMES=""

                  if systemctl is-active --quiet docker; then
                    DOCKER_STATE="active"
                  fi

                  if docker inspect mc-server >/dev/null 2>&1; then
                    CONTAINER_STATE=$(docker inspect -f "{{.State.Status}}" mc-server)

                    if [ "$CONTAINER_STATE" = "running" ]; then
                      PLAYERS=$(timeout 10 docker exec mc-server rcon-cli list 2>/dev/null || true)

                      PLAYER_COUNT=$(printf "%s\n" "$PLAYERS" |
                        sed -n "s/.*There are \([0-9][0-9]*\) of.*/\1/p" |
                        head -n1)

                      PLAYER_NAMES=$(printf "%s\n" "$PLAYERS" |
                        sed -n "s/.*players online: *//p" |
                        tail -n1)

                      if [ -z "$PLAYER_COUNT" ]; then
                PLAYER_COUNT="null"
                PLAYER_NAMES="null"
              elif [ "$PLAYER_COUNT" -gt 0 ] && [ -z "$PLAYER_NAMES" ]; then
                PLAYER_NAMES="null"
              fi
                    fi
                  fi

                  export DOCKER_STATE CONTAINER_STATE PLAYER_COUNT PLAYER_NAMES

                  python3 -c "import json,os; print(\"MC_STATUS_JSON:\" + json.dumps({\"docker\":os.environ[\"DOCKER_STATE\"],\"container\":os.environ[\"CONTAINER_STATE\"],\"players\":(int(os.environ[\"PLAYER_COUNT\"]) if os.environ[\"PLAYER_COUNT\"].isdigit() else None),\"player_names\":(None if os.environ[\"PLAYER_NAMES\"] == \"null\" else [n.strip() for n in os.environ[\"PLAYER_NAMES\"].split(\",\") if n.strip()])},separators=(\",\",\":\")))"
                ' --output json)

              ACCESS_METHOD="azure_run_command"
              REMOTE_STATUS=$(printf '%s' "$RUN_RESULT" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          messages="\n".join(x.get("message","") for x in data.get("value",[]))
          marker="MC_STATUS_JSON:"
          line=next((x for x in messages.splitlines() if marker in x), "")
          print(line.split(marker,1)[1] if line else "{}")
              ')

            fi
            echo "=== RESPOSTA SSH ==="
            printf '%s\n' "$REMOTE_STATUS"
            echo "=== FIM RESPOSTA SSH ==="
            # Remover o prefixo MC_STATUS_JSON: da resposta SSH
            REMOTE_STATUS=$(printf '%s\n' "$REMOTE_STATUS" | sed 's/^MC_STATUS_JSON://')
                            
            # Ler os dados JSON
            DOCKER=$(echo "$REMOTE_STATUS" | jq -r '.docker // "unknown"')
            CONTAINER=$(echo "$REMOTE_STATUS" | jq -r '.container // "unknown"')
            PLAYER_COUNT=$(echo "$REMOTE_STATUS" | jq -r '.players // "null"')
            PLAYER_NAMES=$(echo "$REMOTE_STATUS" | jq -c '.player_names // null')
          fi

          RESULT=$(jq -cn \
            --arg vm "$VM_STATUS" \
            --arg ip "$IP" \
            --argjson port "$PORT_OPEN" \
            --arg docker "$DOCKER" \
            --arg container "$CONTAINER" \
            --argjson players "$PLAYER_COUNT" \
            --argjson names "$PLAYER_NAMES" \
            --arg access_method "$ACCESS_METHOD" \
            --arg checked "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{vm:$vm,ip:$ip,port_open:$port,docker:$docker,container:$container,players:$players,player_names:$names,access_method:$access_method,checked_at:$checked}')

          echo "status_json=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Cifrar e enviar resultado temporário
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          REQUEST_ID: ${{ inputs.request_id }}
          STATUS_JSON: ${{ steps.status.outputs.status_json }}
          WORKER_URL: "https://mc-start-control.luismariohernandezsantos.workers.dev"

        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const crypto = require("crypto");

          (async () => {
            const password = process.env.ACCESS_PASSWORD;

            if (!password || password.length < 20) {
              throw new Error("Falta configurar o secret ACCESS_PASSWORD no GitHub.");
            }

            const salt = crypto.randomBytes(16);
            const iv = crypto.randomBytes(12);

            const key = crypto.pbkdf2Sync(password, salt, 100000, 32, "sha256");

            const cipher = crypto.createCipheriv("aes-256-gcm", key, iv);

            const encrypted = Buffer.concat([
              cipher.update(process.env.STATUS_JSON, "utf8"),
              cipher.final(),
              cipher.getAuthTag()
            ]);

            const payload = {
              request_id: process.env.REQUEST_ID,
              password,
              envelope: {
                salt: salt.toString("base64"),
                iv: iv.toString("base64"),
                data: encrypted.toString("base64")
              }
            };

            const response = await fetch(process.env.WORKER_URL + "/api/status-result", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              throw new Error("O Worker recusou o resultado (" + response.status + ").");
            }

            console.log("Resultado enviado e guardado temporariamente.");

          })().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
