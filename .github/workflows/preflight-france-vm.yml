name: Azure subscription Europe region preflight (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc-server-vm-operations
  cancel-in-progress: false

jobs:
  europe-region-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Login na Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Mascarar identificadores de infraestrutura
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          echo "::add-mask::$AZURE_RESOURCE_GROUP"
          echo "::add-mask::$AZURE_VM_NAME"
          SUBSCRIPTION_ID="$(az account show --query id --only-show-errors --output tsv)"
          echo "::add-mask::$SUBSCRIPTION_ID"

      - name: Executar inventário read-only da subscrição
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          bash -n vm/france-preflight.sh
          bash vm/france-preflight.sh
