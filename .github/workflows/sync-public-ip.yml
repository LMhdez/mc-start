name: Sincronizar IP publico Azure
# Sincroniza também quando este workflow é atualizado.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-public-ip.yml"

permissions:
  contents: read

jobs:
  sync-public-ip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Conceder leitura minima da rede ao Worker
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          WORKER_AZURE_CLIENT_ID: "df3a8487-eb40-4dad-a1a7-15a457fa4077"
        run: |
          set -euo pipefail

          # Obter os IDs dos recursos de rede associados a esta VM.
          WORKER_OBJECT_ID="$(az ad sp show --id "$WORKER_AZURE_CLIENT_ID" --query id -o tsv)"
          NIC_ID="$(az vm show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME" --query 'networkProfile.networkInterfaces[0].id' -o tsv)"
          if [ -z "$WORKER_OBJECT_ID" ] || [ -z "$NIC_ID" ]; then
            echo "Nao foi possivel resolver a identidade ou a interface de rede."
            exit 1
          fi

          PUBLIC_IP_ID="$(az network nic show --ids "$NIC_ID" --query 'ipConfigurations[?publicIPAddress!=null].publicIPAddress.id | [0]' -o tsv)"
          if [ -z "$PUBLIC_IP_ID" ] || [ "$PUBLIC_IP_ID" = "None" ]; then
            echo "Nao foi encontrado um recurso de IP publico associado."
            exit 1
          fi

          # Network Reader concede apenas leitura de recursos Microsoft.Network.
          for SCOPE in "$NIC_ID" "$PUBLIC_IP_ID"; do
            az role assignment create \
              --assignee-object-id "$WORKER_OBJECT_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Network Reader" \
              --scope "$SCOPE" \
              --only-show-errors >/dev/null
          done

          echo "Permissao Network Reader aplicada nos dois recursos de rede."
      - name: Obter IP publico da VM
        id: ip
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail

          IP=$(az vm list-ip-addresses \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" \
            -o tsv)

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Azure nao devolveu um IP publico para a VM."
            exit 1
          fi

          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "IP publico obtido do Azure."

      - name: Guardar IP no Worker
        shell: bash
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          IP: ${{ steps.ip.outputs.ip }}
          WORKER_URL: "https://mc-start-control.luismariohernandezsantos.workers.dev"
        run: |
          set -euo pipefail

          if [ -z "${ACCESS_PASSWORD:-}" ]; then
            echo "Falta o secret ACCESS_PASSWORD."
            exit 1
          fi

          PAYLOAD=$(jq -cn \
            --arg password "$ACCESS_PASSWORD" \
            --arg ip "$IP" \
            '{password:$password,ip:$ip}')

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -X POST "$WORKER_URL/api/ip-result" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" >/dev/null

          echo "IP publico sincronizado no Worker."