name: Atualizar agente privado MC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "vm/mc-agent.py"

permissions:
  contents: read

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Preparar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MC_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Falta o secret MC_VM_SSH_PRIVATE_KEY."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Atualizar agente na VM
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          IP=$(az vm list-ip-addresses \\
            --resource-group "$AZURE_RESOURCE_GROUP" \\
            --name "$AZURE_VM_NAME" \\
            --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" \\
            -o tsv)

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Não foi possível obter o IP público da VM."
            exit 1
          fi

          SSH_OPTS="-i $HOME/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          scp $SSH_OPTS vm/mc-agent.py "azureuser@$IP:/tmp/mc-agent.py"
          ssh $SSH_OPTS "azureuser@$IP" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          install -d -m 0755 /opt/mc-agent
          install -m 0755 /tmp/mc-agent.py /opt/mc-agent/mc-agent.py
          rm -f /tmp/mc-agent.py
          systemctl restart mc-private-agent.service
          systemctl is-active --quiet mc-private-agent.service
          echo "Agente privado atualizado e ativo."
          REMOTE
