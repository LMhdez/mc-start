name: Atualizar agente privado MC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc-server-vm-operations
  cancel-in-progress: false

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter codigo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Login na Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Atualizar agente pela Azure Run Command
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail

          VM_STATUS=$(az vm get-instance-view \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" \
            -o tsv)

          if [[ "$VM_STATUS" != "VM running" ]]; then
            echo "A VM tem de estar ligada para atualizar o agente (estado: $VM_STATUS). Nenhuma alteração foi aplicada."
            exit 1
          fi

          AGENT_B64="$(base64 -w0 vm/mc-agent.py)"
          SCRIPT="set -eu
          install -d -m 0755 /opt/mc-agent
          TARGET=/opt/mc-agent/mc-agent.py
          TMP=\$(mktemp /opt/mc-agent/mc-agent.py.XXXXXX)
          BACKUP=/opt/mc-agent/mc-agent.py.rollback.\$\$
          HAD_OLD=0
          if [ -f \"\$TARGET\" ]; then
            cp -p \"\$TARGET\" \"\$BACKUP\"
            HAD_OLD=1
          fi
          trap 'rm -f \"\$TMP\"' EXIT
          printf '%s' '$AGENT_B64' | base64 -d > \"\$TMP\"
          chmod 0755 \"\$TMP\"
          python3 -c 'import pathlib,sys; compile(pathlib.Path(sys.argv[1]).read_text(encoding=\"utf-8\"), sys.argv[1], \"exec\")' \"\$TMP\"
          mv -f \"\$TMP\" \"\$TARGET\"

          if ! systemctl restart mc-private-agent.service || \
             ! systemctl is-active --quiet mc-private-agent.service || \
             ! python3 -c 'import json,urllib.request; response=urllib.request.urlopen(\"http://127.0.0.1:8765/status\", timeout=8); data=json.load(response); assert data.get(\"ok\") is True'; then
            echo 'O novo agente falhou na verificacao; a restaurar a versao anterior.'
            if [ \"\$HAD_OLD\" = 1 ]; then
              mv -f \"\$BACKUP\" \"\$TARGET\"
              systemctl restart mc-private-agent.service || true
            else
              rm -f \"\$TARGET\"
              systemctl stop mc-private-agent.service || true
            fi
            exit 1
          fi

          rm -f \"\$BACKUP\"
          echo AGENT_DEPLOY_OK"

          RESULT=$(az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --command-id RunShellScript \
            --scripts "$SCRIPT" \
            --query "value[].message" \
            -o tsv)

          printf '%s\n' "$RESULT"
          if ! grep -q "AGENT_DEPLOY_OK" <<< "$RESULT"; then
            echo "A VM nao confirmou a atualizacao do agente."
            exit 1
          fi

      - name: Sincronizar inventario publico
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 90 \
            -H "Origin: https://lmhdez.github.io" \
            "https://mc-start-control.luismariohernandezsantos.workers.dev/api/technical")

          python3 -c '
          import json, sys
          data = json.loads(sys.stdin.read())
          result = data.get("result") or {}
          if data.get("ok") is not True or result.get("mods_inventory_available") is not True:
              raise SystemExit("O inventario publico nao foi atualizado.")
          mods = result.get("mods") or []
          icons = sum(1 for mod in mods if isinstance(mod.get("icon"), str) and mod["icon"].startswith("data:image/"))
          print("Inventario sincronizado:", len(mods), "mods;", icons, "icones extraidos.")
          print("Atualizado em:", result.get("checked_at", "sem data"))
          ' <<< "$RESPONSE"
