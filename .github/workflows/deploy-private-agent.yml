name: Atualizar agente privado MC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "vm/mc-agent.py"

permissions:
  contents: read

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Atualizar agente pela Azure Run Command
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail

          AGENT_B64="$(base64 -w0 vm/mc-agent.py)"
          SCRIPT="set -eu
          install -d -m 0755 /opt/mc-agent
          printf '%s' '$AGENT_B64' | base64 -d > /opt/mc-agent/mc-agent.py
          chmod 0755 /opt/mc-agent/mc-agent.py
          systemctl restart mc-private-agent.service
          systemctl is-active --quiet mc-private-agent.service
          echo AGENT_DEPLOY_OK"

          RESULT=$(az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --command-id RunShellScript \
            --scripts "$SCRIPT" \
            --query "value[].message" \
            -o tsv)

          printf '%s\n' "$RESULT"
          if ! grep -q "AGENT_DEPLOY_OK" <<< "$RESULT"; then
            echo "A VM nao confirmou a atualizacao do agente."
            exit 1
          fi
