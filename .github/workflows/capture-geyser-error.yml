name: Capturar erro Bedrock (Geyser)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-geyser-error.yml

permissions:
  contents: read

concurrency:
  group: mc-server-vm-operations
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Login na Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ler configuração e logs recentes
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          status() { az vm get-instance-view -g "$RG" -n "$VM" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv; }
          initial="$(status)"
          started=0
          cleanup() {
            if [[ "$started" == 1 ]]; then
              az vm deallocate -g "$RG" -n "$VM" --no-wait || true
              for i in {1..90}; do
                [[ "$(status)" == "VM deallocated" ]] && { echo "VM_STATE_RESTORED=VM deallocated"; return; }
                sleep 10
              done
              echo "WARNING: VM deallocation not confirmed"
            fi
          }
          trap cleanup EXIT
          echo "INITIAL_VM_STATUS=$initial"
          if [[ "$initial" == "VM deallocated" || "$initial" == "VM stopped" ]]; then
            started=1
            az vm start -g "$RG" -n "$VM" --no-wait
          elif [[ "$initial" != "VM running" ]]; then
            echo "Unexpected VM state: $initial"; exit 1
          fi
          for i in {1..90}; do
            current="$(status)"
            [[ "$current" == "VM running" ]] && break
            sleep 10
          done
          [[ "$current" == "VM running" ]]
          SCRIPT=$(cat <<'REMOTE'
          set -eu
          C=mc-server
          echo "=== CONTAINER ==="
          docker inspect "$C" --format 'STATUS={{.State.Status}}'
          echo "=== CONFIG LOCATIONS ==="
          docker exec "$C" sh -c 'find /data /config / -path /proc -prune -o -path /sys -prune -o -path /dev -prune -o -type f -path "*/Geyser-Fabric/config.yml" -print 2>/dev/null | head -n 10'
          echo "=== ACTIVE GEYSER CONFIG ==="
          docker exec "$C" sh -c '
            F=$(find /data /config -type f -path "*/Geyser-Fabric/config.yml" -print -quit 2>/dev/null || true)
            if [ -z "$F" ]; then echo CONFIG_NOT_FOUND; exit 0; fi
            echo CONFIG_PATH=$F
            awk "
              /^bedrock:/ {p=1; print; next}
              /^[^ #]/ && p {exit}
              p && /(port:|transport:|webrtc-port:|signaling:|mode:|advertise-addresses:|address:)/ {print}
            " "$F"
          '
          echo "=== GEYSER EVENTS SINCE 10:05 UTC ==="
          docker logs --since 15m --timestamps "$C" 2>&1 | grep -iE 'geyser|nethernet|floodgate|bedrock|guardian|disconnect|timeout|error|exception|2225|19132|signaling|STUN' | tail -n 180 || true
          echo "=== END ==="
          REMOTE
          )
          az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --scripts "$SCRIPT" --query "value[].message" -o tsv
