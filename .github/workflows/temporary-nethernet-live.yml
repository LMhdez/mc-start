name: Temporary NetherNet live connection and Azure network audit
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  capture:
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-LIVE]')
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Inspect Azure effective network rules
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -eu
          echo '=== AZURE NETWORK SECURITY RULES ===' > network.txt
          NIC_IDS=$(az vm show -g "$RG" -n "$VM" --query 'networkProfile.networkInterfaces[].id' -o tsv)
          for NIC in $NIC_IDS; do
            echo "NIC: $(basename "$NIC")" >> network.txt
            if az network nic list-effective-nsg --ids "$NIC" -o json > effective.json 2>error.txt; then
              python3 -c "import json; d=json.load(open('effective.json')); items=d if isinstance(d,list) else d.get('value',[]); rules=[r for i in items for r in i.get('effectiveSecurityRules',[]) if r.get('direction')=='Inbound' and ('19132' in str(r.get('destinationPortRange',r.get('destinationPortRanges',''))) or str(r.get('destinationPortRange',r.get('destinationPortRanges',''))) in ('*','[*]'))]; [print('INBOUND name=%s access=%s protocol=%s priority=%s destination=%s' % (r.get('name'),r.get('access'),r.get('protocol'),r.get('priority'),r.get('destinationPortRange',r.get('destinationPortRanges','')))) for r in rules]; print('Relevant inbound effective rules:',len(rules))" >> network.txt
            else
              echo 'Effective NSG query failed' >> network.txt
              sed -n '1,5p' error.txt >> network.txt
            fi
            PUB=$(az network nic show --ids "$NIC" --query 'ipConfigurations[?publicIpAddress!=null].name' -o tsv)
            if [ -n "$PUB" ]; then echo 'Public IP association: YES' >> network.txt; else echo 'Public IP association: NO' >> network.txt; fi
          done
      - name: Capture live connection and locate Geyser config
        id: diag
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -eu
          SCRIPT=$(cat <<'EOS'
          set -u
          echo '=== CLOCK / CONTAINER ==='
          date -u '+HOST %Y-%m-%dT%H:%M:%SZ'
          docker ps --filter name=mc-server --format '{{.Names}} {{.Status}}'
          echo '=== GEYSER CONFIG FILE DISCOVERY ==='
          docker exec mc-server sh -c 'find /data /config /plugins /opt -type f 2>/dev/null | grep -Ei "geyser|config\\.(yml|yaml)$" | head -60' || true
          echo '=== EFFECTIVE GEYSER CONFIG KEYS ==='
          docker exec mc-server sh -c '
            find /data /config /plugins /opt -type f \( -iname "*.yml" -o -iname "*.yaml" \) 2>/dev/null | while read f; do
              if echo "$f" | grep -qi geyser || grep -qi "geyser" "$f" 2>/dev/null; then
                echo "FILE=$f"
                grep -nEi "^[[:space:]]*(bedrock:|port:|clone-remote-port:|broadcast-port:|address:|transport:|webrtc-port:|signaling:|mode:|use-direct-connection:|enable-proxy-protocol:)" "$f" 2>/dev/null || true
              fi
            done
          ' 2>&1 | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/[IP REDACTED]/g'
          echo '=== DOCKER PORTS ==='
          docker port mc-server 2>&1 || true
          echo '=== UDP 19132 CAPTURE (90 SECONDS) ==='
          if command -v timeout >/dev/null 2>&1 && command -v tcpdump >/dev/null 2>&1; then
            timeout 90 tcpdump -nn -tt -i any 'udp port 19132' 2>&1 | tail -150 | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/[IP REDACTED]/g' || true
          else echo 'tcpdump unavailable'; fi
          echo '=== GEYSER LOGS (LAST 3 MINUTES) ==='
          docker logs --since 3m --timestamps mc-server 2>&1 | grep -Ei 'Geyser|Bedrock|NetherNet|connection|session|handshake|error|exception|timeout|STUN|ICE|signaling' | tail -120 | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/[IP REDACTED]/g; s/(Player|player) [^ ]+/\1 [REDACTED]/g' || true
          EOS
          )
          az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --scripts "$SCRIPT" --query 'value[0].message' -o tsv > diag.txt
          { echo 'report<<EOF'; cat network.txt; cat diag.txt; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.diag.outputs.report }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'## Azure network / Geyser diagnostics\n\n```text\n'+(process.env.REPORT||'No report')+'\n```'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});