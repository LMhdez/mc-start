name: Instalar agente privado MC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc-server-vm-operations
  cancel-in-progress: false

jobs:
  install-private-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter codigo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Login na Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Preparar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MC_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Falta o secret MC_VM_SSH_PRIVATE_KEY."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          trap 'rm -f "$HOME/.ssh/id_rsa" "$RUNNER_TEMP/cloudflare-tunnel-token"' EXIT

      - name: Instalar o agente e reparar o Cloudflare Tunnel
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            echo "Falta o secret CLOUDFLARE_TUNNEL_TOKEN."
            exit 1
          fi

          VM_STATUS=$(az vm get-instance-view \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" \
            -o tsv)
          if [[ "$VM_STATUS" != "VM running" ]]; then
            echo "A VM tem de estar ligada para instalar o agente privado (estado: $VM_STATUS)."
            exit 1
          fi

          IP=$(az vm list-ip-addresses \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" \
            -o tsv)

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Não foi possível obter o IP público da VM."
            exit 1
          fi

          EXPECTED_HOST_FP=$(az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --command-id RunShellScript \
            --scripts 'ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256' \
            --query "value[].message" -o tsv | grep -oE 'SHA256:[A-Za-z0-9+/=]+' | tail -n1)
          if [ -z "$EXPECTED_HOST_FP" ]; then
            echo "Não foi possível obter a fingerprint SSH autenticada pela Azure."
            exit 1
          fi

          ssh-keyscan -T 10 -t ed25519 "$IP" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          ACTUAL_HOST_FP=$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}')
          if [ "$ACTUAL_HOST_FP" != "$EXPECTED_HOST_FP" ]; then
            echo "A fingerprint SSH da VM não corresponde à obtida pela Azure. Ligação cancelada."
            exit 1
          fi

          printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" > "$RUNNER_TEMP/cloudflare-tunnel-token"
          chmod 600 "$RUNNER_TEMP/cloudflare-tunnel-token"

          SSH_OPTS="-i $HOME/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o ConnectTimeout=10"

          scp $SSH_OPTS vm/mc-agent.py "azureuser@$IP:/tmp/mc-agent.py"
          scp $SSH_OPTS "$RUNNER_TEMP/cloudflare-tunnel-token" "azureuser@$IP:/tmp/mc-tunnel-token"

          ssh $SSH_OPTS "azureuser@$IP" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          trap 'rm -f /tmp/mc-tunnel-token /tmp/mc-agent.py' EXIT

          chmod 0600 /tmp/mc-tunnel-token
          apt-get update
          apt-get install -y ca-certificates curl

          install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            -o /usr/share/keyrings/cloudflare-main.gpg
          chmod 0644 /usr/share/keyrings/cloudflare-main.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
            > /etc/apt/sources.list.d/cloudflared.list

          apt-get update
          apt-get install -y cloudflared

          install -d -m 0755 /opt/mc-agent
          install -m 0755 /tmp/mc-agent.py /opt/mc-agent/mc-agent.py
          rm -f /tmp/mc-agent.py

          cat > /etc/systemd/system/mc-private-agent.service <<'SERVICE'
          [Unit]
          Description=Private Minecraft status and stop agent
          After=network-online.target docker.service
          Wants=network-online.target
          Requires=docker.service

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/bin/python3 /opt/mc-agent/mc-agent.py
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=full
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          SERVICE

          if [ ! -s /tmp/mc-tunnel-token ]; then
            echo "O ficheiro temporário do token do Tunnel está vazio."
            exit 1
          fi

          # O token fica num ficheiro root-only; nunca é passado na linha de comandos.
          install -d -o root -g root -m 0700 /etc/cloudflared
          install -o root -g root -m 0600 /tmp/mc-tunnel-token /etc/cloudflared/token
          rm -f /tmp/mc-tunnel-token

          # Recriar sempre o unit file garante que uma rotação do token é aplicada.
          cat > /etc/systemd/system/cloudflared.service <<'SERVICE'
          [Unit]
          Description=Cloudflare Tunnel
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/cloudflared tunnel --no-autoupdate run --token-file /etc/cloudflared/token
          Restart=on-failure
          RestartSec=5s
          NoNewPrivileges=true
          ProtectSystem=full
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable mc-private-agent.service cloudflared.service
          systemctl restart mc-private-agent.service
          systemctl restart cloudflared.service

          systemctl is-active --quiet mc-private-agent.service
          systemctl is-active --quiet cloudflared.service
          echo "Agente privado ativo. Token do Tunnel reposto com permissões 600 e serviço reiniciado."
          REMOTE

          rm -f "$RUNNER_TEMP/cloudflare-tunnel-token"
