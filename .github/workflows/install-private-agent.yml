name: Instalar agente privado MC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-private-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Preparar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MC_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Falta o secret MC_VM_SSH_PRIVATE_KEY."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Instalar o agente e o Cloudflare Tunnel
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            echo "Falta o secret CLOUDFLARE_TUNNEL_TOKEN."
            exit 1
          fi

          IP=$(az vm list-ip-addresses \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" \
            -o tsv)

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Não foi possível obter o IP público da VM."
            exit 1
          fi

          printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" > "$RUNNER_TEMP/cloudflare-tunnel-token"
          chmod 600 "$RUNNER_TEMP/cloudflare-tunnel-token"

          SSH_OPTS="-i $HOME/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"

          scp $SSH_OPTS vm/mc-agent.py "azureuser@$IP:/tmp/mc-agent.py"
          scp $SSH_OPTS "$RUNNER_TEMP/cloudflare-tunnel-token" "azureuser@$IP:/tmp/mc-tunnel-token"

          ssh $SSH_OPTS "azureuser@$IP" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y ca-certificates curl

          install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            -o /usr/share/keyrings/cloudflare-main.gpg
          chmod 0644 /usr/share/keyrings/cloudflare-main.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
            > /etc/apt/sources.list.d/cloudflared.list

          apt-get update
          apt-get install -y cloudflared

          install -d -m 0755 /opt/mc-agent
          install -m 0755 /tmp/mc-agent.py /opt/mc-agent/mc-agent.py
          rm -f /tmp/mc-agent.py

          cat > /etc/systemd/system/mc-private-agent.service <<'SERVICE'
          [Unit]
          Description=Private Minecraft status and stop agent
          After=network-online.target docker.service
          Wants=network-online.target
          Requires=docker.service

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/bin/python3 /opt/mc-agent/mc-agent.py
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=full
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          SERVICE

          TOKEN=$(cat /tmp/mc-tunnel-token)
          rm -f /tmp/mc-tunnel-token
          if [ -z "$TOKEN" ]; then
            echo "O token do Tunnel está vazio."
            exit 1
          fi

          # Se o Tunnel ja estiver instalado, preserva a configuracao existente.
          # Isto evita substituir um servico que ja pode estar ligado ao tunnel correto.
          if [ ! -f /etc/systemd/system/cloudflared.service ]; then
            cloudflared service install "$TOKEN"
          else
            echo "Cloudflare Tunnel ja tem um servico instalado; a configuracao existente sera mantida."
          fi
          unset TOKEN

          systemctl daemon-reload
          systemctl enable --now mc-private-agent.service
          systemctl enable --now cloudflared.service

          systemctl is-active --quiet mc-private-agent.service
          systemctl is-active --quiet cloudflared.service
          echo "Agente privado e Cloudflare Tunnel instalados."
          REMOTE

          rm -f "$RUNNER_TEMP/cloudflare-tunnel-token"
