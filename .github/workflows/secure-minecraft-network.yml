name: Secure Minecraft network rules

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  secure-minecraft:
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-SECURE]')
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restrict Minecraft rules to required protocols
        id: secure
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          stage="discover VM network interface"
          trap 'rc=$?; echo "operation_status=failed" >> "$GITHUB_OUTPUT"; echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"; exit "$rc"' ERR

          NIC=$(az vm show -g "$RG" -n "$VM" --query 'networkProfile.networkInterfaces[0].id' -o tsv)
          if [ -z "$NIC" ] || [ "$NIC" = "None" ]; then
            echo "No VM network interface found." >&2
            exit 1
          fi

          stage="discover NIC network security group"
          NSG_ID=$(az network nic show --ids "$NIC" --query 'networkSecurityGroup.id' -o tsv)
          if [ -z "$NSG_ID" ] || [ "$NSG_ID" = "None" ]; then
            echo "No NIC-level network security group found; refusing to change network rules." >&2
            exit 1
          fi
          NSG=$(basename "$NSG_ID")

          stage="read current Minecraft rule"
          EXISTING=$(az network nsg rule list -g "$RG" --nsg-name "$NSG" --query "[?name=='Minecraft'] | [0].priority" -o tsv)
          if [ -z "$EXISTING" ] || [ "$EXISTING" = "None" ]; then
            echo "Expected Minecraft rule was not found; refusing to create replacement rules blindly." >&2
            exit 1
          fi

          # Keep Java publicly reachable, but only over its required TCP transport.
          stage="update Java TCP rule"
          az network nsg rule update -g "$RG" --nsg-name "$NSG" -n Minecraft \
            --priority "$EXISTING" --direction Inbound --access Allow --protocol Tcp \
            --source-address-prefixes '*' --source-port-ranges '*' \
            --destination-address-prefixes '*' --destination-port-ranges 25565 \
            --description "Minecraft Java TCP only"

          # Select a free priority after the existing Minecraft rule.
          stage="inspect Bedrock rule and choose priority"
          if az network nsg rule show -g "$RG" --nsg-name "$NSG" -n Minecraft-Bedrock >/dev/null 2>&1; then
            BEDROCK_PRIORITY=$(az network nsg rule show -g "$RG" --nsg-name "$NSG" -n Minecraft-Bedrock --query priority -o tsv)
          else
            USED=$(az network nsg rule list -g "$RG" --nsg-name "$NSG" --query '[].priority' -o tsv)
            BEDROCK_PRIORITY=""
            for p in $(seq $((EXISTING + 1)) 4096); do
              if ! printf '%s\n' "$USED" | grep -qx "$p"; then
                BEDROCK_PRIORITY="$p"
                break
              fi
            done
            if [ -z "$BEDROCK_PRIORITY" ]; then
              echo "No free NSG priority available for Bedrock rule." >&2
              exit 1
            fi
          fi

          stage="create or update Bedrock UDP rule"
          BEDROCK_ARGS=(-g "$RG" --nsg-name "$NSG" -n Minecraft-Bedrock
            --priority "$BEDROCK_PRIORITY" --direction Inbound --access Allow --protocol Udp
            --source-address-prefixes '*' --source-port-ranges '*'
            --destination-address-prefixes '*' --destination-port-ranges 19132
            --description "Minecraft Bedrock UDP only")
          if az network nsg rule show -g "$RG" --nsg-name "$NSG" -n Minecraft-Bedrock >/dev/null 2>&1; then
            az network nsg rule update "${BEDROCK_ARGS[@]}" >/dev/null
          else
            az network nsg rule create "${BEDROCK_ARGS[@]}" >/dev/null
          fi

          # Emit only a non-sensitive summary; never print IPs, CIDRs, credentials, or raw rule objects.
          stage="complete"
          echo "operation_status=success" >> "$GITHUB_OUTPUT"
          echo "failure_stage=none" >> "$GITHUB_OUTPUT"
          echo "nsg_name=$NSG" >> "$GITHUB_OUTPUT"
          echo "java_rule=TCP/25565" >> "$GITHUB_OUTPUT"
          echo "bedrock_rule=UDP/19132" >> "$GITHUB_OUTPUT"
          echo "bedrock_priority=$BEDROCK_PRIORITY" >> "$GITHUB_OUTPUT"

      - name: Report safe summary
        if: always()
        uses: actions/github-script@v7
        env:
          OPERATION_STATUS: ${{ steps.secure.outputs.operation_status }}
          FAILURE_STAGE: ${{ steps.secure.outputs.failure_stage }}
        with:
          script: |
            const ok = process.env.OPERATION_STATUS === 'success';
            const body = ok
              ? '## Minecraft network rules updated\\n\\n- Java: TCP 25565 only\\n- Bedrock: UDP 19132 only\\n- Public player access retained.\\n- SSH rule unchanged.\\n- No IPs, CIDRs, credentials, or raw configuration included.'
              : '## Minecraft network hardening did not complete\\n\\nThe workflow stopped at: ' + (process.env.FAILURE_STAGE || 'unknown') + '.\\nNo raw command output or sensitive configuration is included. The rule state must be checked before retrying.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            if (ok) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
