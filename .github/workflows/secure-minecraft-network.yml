name: Secure Minecraft network rules

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  secure-minecraft:
    # The issue must be opened by the repository owner and contain the exact
    # confirmation phrase. This is a mutating NSG operation, never diagnostics.
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-SECURE]') && contains(github.event.issue.body, 'CONFIRM-NSG-CHANGE')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Preserve required Minecraft protocols
        id: secure
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          set +x
          stage="discover VM network interface"
          trap 'rc=$?; echo "operation_status=failed" >> "$GITHUB_OUTPUT"; echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"; exit "$rc"' ERR

          NIC=$(az vm show -g "$RG" -n "$VM" --query 'networkProfile.networkInterfaces[0].id' -o tsv 2>/dev/null)
          if [ -z "$NIC" ] || [ "$NIC" = "None" ]; then
            echo "VM network interface unavailable; no NSG changes made." >&2
            exit 1
          fi

          stage="discover NIC network security group"
          NSG_ID=$(az network nic show --ids "$NIC" --query 'networkSecurityGroup.id' -o tsv 2>/dev/null)
          if [ -z "$NSG_ID" ] || [ "$NSG_ID" = "None" ]; then
            echo "NIC-level NSG unavailable; no NSG changes made." >&2
            exit 1
          fi
          NSG=$(basename "$NSG_ID")

          stage="read existing Minecraft rule"
          EXISTING=$(az network nsg rule list -g "$RG" --nsg-name "$NSG" --query "[?name=='Minecraft'] | [0].priority" -o tsv 2>/dev/null)
          if ! [[ "$EXISTING" =~ ^[0-9]+$ ]]; then
            echo "Expected Minecraft rule not found; refusing blind NSG changes." >&2
            exit 1
          fi

          stage="update Java TCP rule"
          az network nsg rule update -g "$RG" --nsg-name "$NSG" -n Minecraft             --priority "$EXISTING" --direction Inbound --access Allow --protocol Tcp             --source-address-prefixes '*' --source-port-ranges '*'             --destination-address-prefixes '*' --destination-port-ranges 25565             --description "Minecraft Java TCP" --output none

          find_priority() {
            local used p
            used=$(az network nsg rule list -g "$RG" --nsg-name "$NSG" --query '[].priority' -o tsv 2>/dev/null)
            for p in $(seq $((EXISTING + 1)) 4096); do
              if ! printf '%s\n' "$used" | grep -qx "$p"; then
                printf '%s' "$p"
                return 0
              fi
            done
            return 1
          }

          ensure_rule() {
            local name="$1" protocol="$2" port="$3" description="$4" priority
            if az network nsg rule show -g "$RG" --nsg-name "$NSG" -n "$name" >/dev/null 2>&1; then
              priority=$(az network nsg rule show -g "$RG" --nsg-name "$NSG" -n "$name" --query priority -o tsv 2>/dev/null)
              [[ "$priority" =~ ^[0-9]+$ ]] || return 1
              az network nsg rule update -g "$RG" --nsg-name "$NSG" -n "$name"                 --priority "$priority" --direction Inbound --access Allow --protocol "$protocol"                 --source-address-prefixes '*' --source-port-ranges '*'                 --destination-address-prefixes '*' --destination-port-ranges "$port"                 --description "$description" --output none
            else
              priority=$(find_priority) || return 1
              az network nsg rule create -g "$RG" --nsg-name "$NSG" -n "$name"                 --priority "$priority" --direction Inbound --access Allow --protocol "$protocol"                 --source-address-prefixes '*' --source-port-ranges '*'                 --destination-address-prefixes '*' --destination-port-ranges "$port"                 --description "$description" --output none
            fi
          }

          stage="ensure Bedrock UDP 19132"
          ensure_rule Minecraft-Bedrock-UDP Udp 19132 "Minecraft Bedrock UDP"

          stage="ensure Bedrock TCP 19132"
          ensure_rule Minecraft-Bedrock-TCP Tcp 19132 "Minecraft Bedrock TCP"

          # SSH and unrelated NSG rules are not changed. No raw rule objects,
          # IPs, CIDRs, resource IDs, credentials or command output are emitted.
          stage="complete"
          echo "operation_status=success" >> "$GITHUB_OUTPUT"
          echo "failure_stage=none" >> "$GITHUB_OUTPUT"
          echo "java_rule=TCP/25565" >> "$GITHUB_OUTPUT"
          echo "bedrock_udp_rule=UDP/19132" >> "$GITHUB_OUTPUT"
          echo "bedrock_tcp_rule=TCP/19132" >> "$GITHUB_OUTPUT"

      - name: Report safe summary
        if: always()
        uses: actions/github-script@v7
        env:
          OPERATION_STATUS: ${{ steps.secure.outputs.operation_status }}
          FAILURE_STAGE: ${{ steps.secure.outputs.failure_stage }}
        with:
          script: |
            const ok = process.env.OPERATION_STATUS === 'success';
            const body = ok
              ? '## Minecraft network rules updated\n\n- Java: TCP 25565\n- Bedrock: UDP 19132 and TCP 19132\n- SSH and unrelated rules unchanged.\n- No IPs, CIDRs, credentials, or raw configuration included.'
              : '## Minecraft network update did not complete\n\nThe workflow stopped at: ' + (process.env.FAILURE_STAGE || 'unknown') + '.\nReview the effective NSG before retrying; no raw output is included.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            if (ok) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
