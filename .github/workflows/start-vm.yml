name: Ligar Servidor Minecraft

on:
  workflow_dispatch:
    inputs:
      notificar:
        description: 'Motivo ou utilizador a ligar'
        required: false
        default: 'Manual'
  repository_dispatch:
    types: [start-mc-server]

permissions:
  contents: read

concurrency:
  group: mc-server-vm-operations
  cancel-in-progress: false

jobs:
  start-azure-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Login na Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ligar VM e Confirmar Arranque
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail

          RESOURCE_GROUP="${AZURE_RESOURCE_GROUP:?Falta o secret AZURE_RESOURCE_GROUP}"
          VM_NAME="${AZURE_VM_NAME:?Falta o secret AZURE_VM_NAME}"

          get_status() {
            az vm get-instance-view \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus" \
              -o tsv
          }

          echo "A verificar o estado atual da VM..."
          STATUS=$(get_status)
          echo "Estado atual: $STATUS"

          if [[ "$STATUS" == "VM running" ]]; then
            echo "A VM já está ligada."
          elif [[ "$STATUS" == "VM deallocated" || "$STATUS" == "VM stopped" ]]; then
            echo "A iniciar a máquina virtual..."
            az vm start --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --no-wait
          elif [[ "$STATUS" == "VM starting" ]]; then
            echo "A VM já está em processo de arranque."
          elif [[ "$STATUS" == "VM stopping" ]]; then
            echo "A VM está a desligar. A aguardar..."
            for i in {1..90}; do
              sleep 10
              STATUS=$(get_status)
              echo "Estado: $STATUS"
              if [[ "$STATUS" == "VM running" ]]; then
                echo "A VM já está ligada."
                break
              fi
              if [[ "$STATUS" == "VM deallocated" || "$STATUS" == "VM stopped" ]]; then
                echo "A iniciar a VM..."
                az vm start --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --no-wait
                break
              fi
            done
          else
            echo "ERRO: Estado inesperado da VM."
            exit 1
          fi

          if [[ "$STATUS" == "VM stopping" ]]; then
            echo "ERRO: A VM continuou em processo de desligamento após o tempo limite."
            exit 1
          fi

          echo "A aguardar que a VM fique operacional..."
          for i in {1..90}; do
            STATUS=$(get_status)
            echo "Verificação $i/90: $STATUS"
            if [[ "$STATUS" == "VM running" ]]; then
              echo "SUCESSO: VM ligada e confirmada!"
              exit 0
            fi
            sleep 10
          done

          echo "ERRO: A VM não ficou ligada dentro do tempo limite."
          exit 1

      - name: Identificar Origem do Pedido
        if: success()
        env:
          NOTIFICAR: ${{ github.event.inputs.notificar }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          USER_TRIGGERED="$NOTIFICAR"
          if [ -z "$USER_TRIGGERED" ] || [ "$USER_TRIGGERED" = "Manual" ]; then
            if [ "$EVENT_NAME" = "repository_dispatch" ]; then
              USER_TRIGGERED="Webhook Externo"
            else
              USER_TRIGGERED="Manual"
            fi
          fi
          echo "Ação concluída para: $USER_TRIGGERED"
