name: Ligar Servidor Minecraft

on:
  workflow_dispatch: # Permite disparar o servidor manualmente ou via link externo

jobs:
  start-azure-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ligar a Máquina Virtual
        run: |
          az vm start --resource-group MCServerFreeGroup --name MC-VM
