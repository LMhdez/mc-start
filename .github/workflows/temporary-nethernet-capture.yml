name: Temporary NetherNet capture
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  capture:
    if: github.event.issue.user.login == 'LMhdez' && startsWith(github.event.issue.title, '[MC-DIAG]')
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Capture live server diagnostics
        id: diag
        shell: bash
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -eu
          SCRIPT=$(cat <<'EOS'
          echo '=== CLOCK ==='
          date -u '+HOST %Y-%m-%dT%H:%M:%SZ'
          timedatectl 2>/dev/null | head -8 || true
          echo '=== CONTAINER ==='
          docker ps --filter name=mc-server --format '{{.Names}} {{.Status}}'
          docker exec mc-server date -u '+CONTAINER %Y-%m-%dT%H:%M:%SZ' 2>&1 || true
          echo '=== GEYSER LOGS LAST 30 MIN ==='
          docker logs --since 30m --timestamps mc-server 2>&1 | grep -Ei 'geyser|nether|signaling|stun|ice|bedrock|floodgate|connection|timeout|error|exception|disconnect|login' | tail -250 || true
          echo '=== RECENT FULL LOG TAIL ==='
          docker logs --since 10m --timestamps mc-server 2>&1 | tail -120 || true
          echo '=== PORTS ==='
          docker port mc-server 2>&1 || true
          echo '=== LISTENERS ==='
          ss -lntup 2>/dev/null | grep -E '19132|25565' || true
          echo '=== ACTIVE CONFIG ==='
          grep -nE '^(  port:|  transport:|  address:|  webrtc-port:|    mode:|    advertise-addresses:)' /data/config/Geyser-Fabric/config.yml 2>/dev/null || true
          EOS
          )
          az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --scripts "$SCRIPT" --query "value[0].message" -o tsv > diag.txt
          {
            echo 'report<<EOF'
            cat diag.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.diag.outputs.report }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## NetherNet live capture\n\n```text\n' + (process.env.REPORT || 'No report') + '\n```'
            });
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'});
