name: Desligar Servidor Minecraft

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo do desligamento'
        required: false
        default: 'Manual'
  repository_dispatch:
    types: [stop-mc-server]

permissions:
  contents: read

jobs:
  stop-azure-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desligar VM e Confirmar Desalocação
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        run: |
          set -euo pipefail

          RESOURCE_GROUP="${AZURE_RESOURCE_GROUP:?Falta o secret AZURE_RESOURCE_GROUP}"
          VM_NAME="${AZURE_VM_NAME:?Falta o secret AZURE_VM_NAME}"

          get_status() {
            az vm get-instance-view \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus" \
              -o tsv
          }

          echo "A verificar o estado atual da VM..."
          STATUS=$(get_status)

          if [[ "$STATUS" == "VM starting" || "$STATUS" == "VM stopping" ]]; then
            echo "A VM tem uma operação em curso. A aguardar..."
            for i in {1..90}; do
              sleep 10
              STATUS=$(get_status)
              echo "Verificação $i/90: $STATUS"
              if [[ "$STATUS" != "VM starting" && "$STATUS" != "VM stopping" ]]; then
                break
              fi
            done
          fi

          if [[ "$STATUS" == "VM running" ]]; then
            echo "A parar o contentor Minecraft de forma graciosa..."
            STOP_RESULT=$(az vm run-command invoke \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --command-id RunShellScript \
              --scripts '
                set -eu
                if ! command -v docker >/dev/null 2>&1; then
                  echo "Docker nao esta disponivel na VM."
                  exit 1
                fi
                if systemctl is-active --quiet docker && docker inspect mc-server >/dev/null 2>&1; then
                  CONTAINER_STATE=$(docker inspect -f "{{.State.Status}}" mc-server)
                  if [ "$CONTAINER_STATE" = "running" ]; then
                    docker stop --time 30 mc-server
                  fi
                fi
                echo MC_STOP_OK
              ' \
              --query "value[].message" -o tsv)
            printf '%s\n' "$STOP_RESULT"
            if ! grep -q "MC_STOP_OK" <<< "$STOP_RESULT"; then
              echo "A VM nao confirmou a paragem graciosa do Minecraft; a desalocacao foi cancelada."
              exit 1
            fi
          fi

          if [[ "$STATUS" == "VM deallocated" ]]; then
            echo "A VM já está desalocada."
          elif [[ "$STATUS" == "VM running" || "$STATUS" == "VM stopped" ]]; then
            echo "A enviar pedido de desalocação..."
            az vm deallocate --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --no-wait
          else
            echo "ERRO: Estado inesperado da VM."
            exit 1
          fi

          echo "A aguardar a desalocação completa..."
          for i in {1..90}; do
            STATUS=$(get_status)
            echo "Verificação $i/90: $STATUS"
            if [[ "$STATUS" == "VM deallocated" ]]; then
              echo "SUCESSO: VM desalocada e confirmada!"
              exit 0
            fi
            sleep 10
          done

          echo "ERRO: A VM não foi desalocada dentro do tempo limite."
          exit 1

      - name: Identificar Origem do Pedido
        if: success()
        env:
          MOTIVO: ${{ github.event.inputs.motivo }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          USER_TRIGGERED="$MOTIVO"
          if [ -z "$USER_TRIGGERED" ] || [ "$USER_TRIGGERED" = "Manual" ]; then
            if [ "$EVENT_NAME" = "repository_dispatch" ]; then
              USER_TRIGGERED="Webhook Externo"
            else
              USER_TRIGGERED="Manual"
            fi
          fi
          echo "Desligamento concluído. Origem: $USER_TRIGGERED"
